name: Cleanup legacy runtime secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify protected main dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"

      - name: Remove only the legacy GraphQL password assignment over pinned OpenSSH
        uses: ./.github/actions/pinned-openssh
        env:
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          private-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: VPS_WORKDIR
          script: |
            set -euo pipefail

            expected_workdir=/home/workspace/letletme_data
            target_file="$expected_workdir/.env.migrate"
            assignment_pattern='^[[:space:]]*(export[[:space:]]+)?GRAPHQL_RUNTIME_DB_PASSWORD[[:space:]]*='
            database_url_pattern='^[[:space:]]*(export[[:space:]]+)?DATABASE_URL[[:space:]]*='

            test "$VPS_WORKDIR" = "$expected_workdir"
            test "$(realpath --canonicalize-existing "$VPS_WORKDIR")" = "$expected_workdir"
            test -f "$target_file"
            test ! -L "$target_file"
            test "$(stat -c '%h' "$target_file")" -eq 1
            test "$(stat -c '%u' "$target_file")" -eq "$(id -u)"
            test "$(stat -c '%g' "$target_file")" -eq "$(id -g)"

            target_mode=$(stat -c '%a' "$target_file")
            target_mode_value=$((8#$target_mode))
            test $((target_mode_value & 077)) -eq 0

            normalized_line_endings=false
            if grep -Fq '\n' "$target_file"; then
              umask 077
              temporary_file=$(mktemp "$expected_workdir/.env.migrate.normalize.XXXXXX")
              normalize_temporary_file() {
                if [ -n "${temporary_file:-}" ] && [ -f "$temporary_file" ]; then
                  rm -f -- "$temporary_file"
                fi
              }
              trap normalize_temporary_file EXIT

              # The previous provisioning path wrote literal backslash-n
              # separators. Restore line boundaries without printing values.
              awk '{ gsub(/\\n/, "\n"); print }' "$target_file" > "$temporary_file"
              chmod "$target_mode" "$temporary_file"
              chgrp "$(id -g)" "$temporary_file"
              test "$(stat -c '%a' "$temporary_file")" = "$target_mode"
              test "$(stat -c '%u' "$temporary_file")" -eq "$(id -u)"
              test "$(stat -c '%g' "$temporary_file")" -eq "$(id -g)"
              mv --no-target-directory -- "$temporary_file" "$target_file"
              temporary_file=''
              trap - EXIT
              normalized_line_endings=true
            fi

            legacy_count=$(grep -Ec "$assignment_pattern" "$target_file" || true)
            case "$legacy_count" in
              0)
                changed=false
                ;;
              1)
                changed=true
                ;;
              *)
                echo 'cleanup refused: multiple legacy assignments exist' >&2
                exit 1
                ;;
            esac

            database_url_count=$(grep -Ec "$database_url_pattern" "$target_file" || true)
            test "$database_url_count" -eq 1

            if [ "$changed" = true ]; then
              umask 077
              temporary_file=$(mktemp "$expected_workdir/.env.migrate.cleanup.XXXXXX")
              cleanup_temporary_file() {
                if [ -n "${temporary_file:-}" ] && [ -f "$temporary_file" ]; then
                  rm -f -- "$temporary_file"
                fi
              }
              trap cleanup_temporary_file EXIT

              retained_digest_before=$(awk -v pattern="$assignment_pattern" \
                '$0 !~ pattern { print }' "$target_file" | sha256sum | cut -d ' ' -f 1)
              awk -v pattern="$assignment_pattern" \
                '$0 !~ pattern { print }' "$target_file" > "$temporary_file"
              chmod "$target_mode" "$temporary_file"
              chgrp "$(id -g)" "$temporary_file"

              test "$(stat -c '%a' "$temporary_file")" = "$target_mode"
              test "$(stat -c '%u' "$temporary_file")" -eq "$(id -u)"
              test "$(stat -c '%g' "$temporary_file")" -eq "$(id -g)"
              test "$(grep -Ec "$assignment_pattern" "$temporary_file" || true)" -eq 0
              test "$(grep -Ec "$database_url_pattern" "$temporary_file" || true)" -eq 1
              retained_digest_after=$(sha256sum "$temporary_file" | cut -d ' ' -f 1)
              test "$retained_digest_before" = "$retained_digest_after"

              mv --no-target-directory -- "$temporary_file" "$target_file"
              temporary_file=''
              trap - EXIT
            fi

            test -f "$target_file"
            test ! -L "$target_file"
            test "$(stat -c '%a' "$target_file")" = "$target_mode"
            test "$(stat -c '%u' "$target_file")" -eq "$(id -u)"
            test "$(stat -c '%g' "$target_file")" -eq "$(id -g)"
            test "$(grep -Ec "$assignment_pattern" "$target_file" || true)" -eq 0
            test "$(grep -Ec "$database_url_pattern" "$target_file" || true)" -eq 1
            if grep -Fq '\n' "$target_file"; then
              echo 'cleanup refused: literal env line endings remain' >&2
              exit 1
            fi

            printf '{"event":"legacy_secret_cleanup","name":"GRAPHQL_RUNTIME_DB_PASSWORD","changed":%s,"lineEndingsNormalized":%s,"remaining":false,"credentialValueExposed":false}\n' \
              "$changed" "$normalized_line_endings"
