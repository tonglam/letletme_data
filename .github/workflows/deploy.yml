name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Resolve protected main and CI gate
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test -n "${WORKFLOW_SHA:-}"
            test "$WORKFLOW_EVENT" = "push"
            test "$main_sha" = "$WORKFLOW_SHA"
          else
            ci_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=20")
            ci_success_count=$(printf '%s' "$ci_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | length')
            test "$ci_success_count" -gt 0
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable SHA image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --label "org.opencontainers.image.revision=${{ steps.target.outputs.sha }}" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"

      - name: Scan immutable image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: HIGH,CRITICAL

      - name: Promote scanned digest to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_REF}"
          expected_digest="${IMAGE_REF##*@}"
          latest_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" | awk '/^Digest:/ { print $2; exit }')
          test "$latest_digest" = "$expected_digest"

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The runtime verifier allows up to 10.5 minutes for a cold restart;
          # leave the SSH action enough time for preflight, migration, and
          # rollback/recovery if readiness never converges.
          command_timeout: 20m
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            old_image=""
            old_revision=""
            old_release_sha=unknown
            old_runner_release_sha=unknown
            ledger_before=""
            image_pull_attempted=false
            deployment_started=false
            deployment_committed=false
            migration_started=false
            services_start_attempted=false
            services_stopped=false
            runner_updated=false
            runner_probe_succeeded=false
            runner_previous_target=""
            runner_previous_release=""
            image_id_for_ref() {
              local image_ref=${1:-}
              [ -n "$image_ref" ] || return 0
              docker image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true
            }
            image_id_is_referenced() {
              local candidate_id=${1:-}
              local container_id container_image_id
              [ -n "$candidate_id" ] || return 1
              while IFS= read -r container_id; do
                [ -n "$container_id" ] || continue
                container_image_id=$(docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null || true)
                if [ "$container_image_id" = "$candidate_id" ]; then
                  return 0
                fi
              done < <(docker ps -aq 2>/dev/null || true)
              return 1
            }
            cleanup_failed_image() {
              local image_ref=${1:-}
              local image_id old_image_id
              [ -n "$image_ref" ] || return 0
              image_id=$(image_id_for_ref "$image_ref")
              if [ -z "$image_id" ]; then
                echo "Data image cleanup: new image is not present; nothing to remove"
                return 0
              fi
              old_image_id=$(image_id_for_ref "$old_image")
              if [ -n "$old_image_id" ] && [ "$image_id" = "$old_image_id" ]; then
                echo "Data image cleanup: retaining new ref because it resolves to the rollback image"
                return 0
              fi
              if image_id_is_referenced "$image_id"; then
                echo "Data image cleanup: retaining $image_ref because a container references it"
                return 0
              fi
              docker image rm "$image_ref" || echo "unable to remove failed Data image reference: $image_ref" >&2
            }
            cleanup_obsolete_data_digests() {
              local image_name="${IMAGE_REF%@*}"
              local digest_ref digest_id scoped_repo_digests
              scoped_repo_digests=$(docker image ls --no-trunc --digests \
                --format '{{.Repository}}@{{.Digest}}' \
                --filter "reference=${image_name}@sha256:*" 2>/dev/null || true)
              while IFS= read -r digest_ref; do
                if [ -z "$digest_ref" ] || [ "$digest_ref" = "$IMAGE_REF" ] || \
                  { [ -n "$old_image" ] && [ "$digest_ref" = "$old_image" ]; }; then
                  continue
                fi
                digest_id=$(image_id_for_ref "$digest_ref")
                if [ -n "$digest_id" ] && image_id_is_referenced "$digest_id"; then
                  echo "Data image cleanup: retaining referenced digest $digest_ref"
                  continue
                fi
                docker image rm "$digest_ref" || echo "unable to remove obsolete Data image reference: $digest_ref" >&2
              done <<< "$scoped_repo_digests"
            }
            on_exit() {
              original_status=$?
              trap - EXIT
              set +e
              if [ "$original_status" -ne 0 ] && [ "$deployment_committed" = false ] && [ "$runner_updated" = true ]; then
                export CONTENT_GROK_RUNNER_RELEASE_SHA="${runner_previous_release:-unknown}"
                scripts/rollback-host-grok-runner.sh \
                  "/home/workspace/letletme-grok-runner" \
                  "$runner_previous_target" "$runner_previous_release" || true
              fi
              if [ "$original_status" -ne 0 ] && [ "$deployment_started" = true ] && [ "$deployment_committed" = false ]; then
                if [ "$services_start_attempted" = true ]; then
                  echo "Data deployment failed after service start; preserving scheduler/worker/content-worker/live-picks-worker/official-h2h-worker/media-worker for recovery" >&2
                  APP_IMAGE="$IMAGE_REF" docker compose ps || true
                  ss -ltnp '( sport = :3000 )' 2>/dev/null || true
                fi
                if [ "$migration_started" = false ] && [ "$services_stopped" = true ] && [ -n "$old_image" ]; then
                  echo "Data deployment failed before migration; restoring previous API and worker image" >&2
                  if [ -n "$old_revision" ]; then
                    git reset --hard "$old_revision" || true
                  fi
                  restore_runtime_services \
                    "$old_image" "$old_release_sha" "$old_runner_release_sha" \
                    "$old_media_present" || true
                elif [ "$migration_started" = true ]; then
                  if ! restore_last_known_healthy_if_ledger_unchanged \
                    "$old_image" "$ledger_before" "$old_revision" "$old_release_sha" \
                    "$old_runner_release_sha" "$old_media_present"; then
                    echo "Data deployment failed after a ledger change or unverifiable ledger state; leaving services stopped for forward recovery" >&2
                  fi
                fi
              fi
              if [ "$original_status" -ne 0 ] && [ "$image_pull_attempted" = true ]; then
                cleanup_failed_image "${IMAGE_REF:-}"
              fi
              release_deploy_lock || true
              exit "$original_status"
            }
            trap on_exit EXIT
            active_stage=""
            stage_started_at=0
            start_stage() {
              active_stage="$1"
              stage_started_at=$(date +%s)
            }
            finish_stage() {
              outcome=${1:-passed}
              finished_at=$(date +%s)
              duration_ms=$(( (finished_at - stage_started_at) * 1000 ))
              printf '{"event":"deploy_stage_timing","stage":"%s","outcome":"%s","durationMs":%s}\n' \
                "$active_stage" "$outcome" "$duration_ms"
              active_stage=""
            }
            start_stage pull
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin
            cd "$VPS_WORKDIR"
            old_revision=$(git rev-parse HEAD)
            git fetch origin main
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            env_file=${ENV_FILE:-.env.deploy}
            migration_env_file=${MIGRATION_ENV_FILE:-.env.migrate}
            media_env_file=${CONTENT_MEDIA_ENV_FILE:-.env.media}
            read_env_setting() {
              key=$1
              file=$2
              value=$(awk -v key="$key" '
                $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                  sub("^[[:space:]]*" key "[[:space:]]*=", "", $0)
                  print
                  exit
                }
              ' "$file")
              value=${value#\"}
              value=${value%\"}
              value=${value#\'}
              value=${value%\'}
              printf '%s' "$value"
            }
            if [ -z "${DATABASE_BACKUP_DIR:-}" ]; then
              DATABASE_BACKUP_DIR=$(read_env_setting DATABASE_BACKUP_DIR "$env_file")
            fi
            if [ -z "${DATABASE_BACKUP_KEEP:-}" ]; then
              DATABASE_BACKUP_KEEP=$(read_env_setting DATABASE_BACKUP_KEEP "$env_file")
            fi
            if [ -z "${DATABASE_BACKUP_PG_MAJOR:-}" ]; then
              DATABASE_BACKUP_PG_MAJOR=$(read_env_setting DATABASE_BACKUP_PG_MAJOR "$env_file")
            fi
            export DATABASE_BACKUP_DIR=${DATABASE_BACKUP_DIR:-/var/backups/letletme-data}
            export DATABASE_BACKUP_KEEP=${DATABASE_BACKUP_KEEP:-7}
            export DATABASE_BACKUP_PG_MAJOR=${DATABASE_BACKUP_PG_MAJOR:-15}
            export DEPLOY_SHA
            export CONTENT_MANIFEST_GIT_REVISION="$DEPLOY_SHA"
            export CONTENT_GROK_RUNNER_RELEASE_SHA="$DEPLOY_SHA"
            export ENV_FILE="$env_file"
            export MIGRATION_ENV_FILE="$migration_env_file"
            export CONTENT_MEDIA_ENV_FILE="$media_env_file"
            test -f "$env_file"
            test -f "$migration_env_file"
            if grep -q '^[[:space:]]*CONTENT_MEDIA_SUPABASE_SECRET_KEY[[:space:]]*=' "$env_file"; then
              echo "deploy preflight: source-media Storage secret must exist only in $media_env_file" >&2
              exit 1
            fi
            APP_IMAGE="$IMAGE_REF" docker compose config --quiet
            DATABASE_CONNECTION_BUDGET="${DATABASE_CONNECTION_BUDGET:-15}" \
              COMPOSE_BIN='docker compose' COMPOSE_FILE=docker-compose.yml PROJECT_DIR="$VPS_WORKDIR" \
              scripts/check-database-pool-budget.sh
            APP_IMAGE="$IMAGE_REF" docker compose config | grep -q 'max-size: 20m'
            APP_IMAGE="$IMAGE_REF" docker compose config | grep -Eq 'max-file: "5"$'
            migration_database_url=$(sed -n 's/^DATABASE_URL=//p' "$migration_env_file" \
              | sed -e 's/^"//' -e 's/"$//')
            if [ -z "$migration_database_url" ]; then
              echo "deploy preflight: DATABASE_URL missing from $migration_env_file"
              exit 1
            fi

            old_container=$(docker compose ps -aq api | head -n 1)
            old_image=""
            old_media_present=false
            if [ -n "$old_container" ]; then
              old_image=$(docker inspect --format '{{.Config.Image}}' "$old_container")
              test -n "$old_image"
            fi
            old_media_container=$(docker compose ps -aq media-worker 2>/dev/null | head -n 1)
            if [ -n "$old_media_container" ]; then old_media_present=true; fi

            export APP_IMAGE="$IMAGE_REF"
            compose() { docker compose "$@"; }
            source scripts/deploy-state-machine.sh
            old_release_sha=$(release_sha_for_image "$old_image")
            old_runner_release_sha=$(cat \
              /home/workspace/letletme-grok-runner/current.release 2>/dev/null || printf unknown)
            old_runner_release_sha=${old_runner_release_sha:-unknown}
            acquire_deploy_lock
            image_pull_attempted=true
            APP_IMAGE="$IMAGE_REF" docker compose --profile migration pull api scheduler worker content-worker live-picks-worker official-h2h-worker media-worker migration backup
            image_revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")
            test "$image_revision" = "$DEPLOY_SHA"
            finish_stage
            start_stage preflight
            echo "deploy preflight: image pulled"
            data_runtime_database_url=$(sed -n 's/^DATABASE_URL=//p' "$env_file" \
              | sed -e 's/^"//' -e 's/"$//')
            if [ -z "$data_runtime_database_url" ]; then
              echo "deploy preflight: DATABASE_URL missing from $env_file"
              exit 1
            fi
            echo "deploy preflight: using the configured Data runtime URL without rewriting it"
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun validate-env.ts --probe-bug-report-storage
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun validate-env.ts --probe-fpl-raw-snapshot-storage
            test -x scripts/bootstrap-briefing-source-media-env.sh
            scripts/bootstrap-briefing-source-media-env.sh "$env_file" "$media_env_file"
            media_worker_setting=false
            if [ -f "$media_env_file" ]; then
              media_worker_setting=$(read_env_setting CONTENT_MEDIA_WORKER_ENABLED "$media_env_file" | tr '[:upper:]' '[:lower:]' || true)
            fi
            if [[ "$media_worker_setting" =~ ^(1|true|yes|on)$ ]]; then
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T media-worker \
                bun dist/media-worker.js --provision-and-probe
            else
              echo 'deploy preflight: source-media worker disabled; Storage probe skipped'
            fi
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun scripts/wait-for-migration-login.ts
            finish_stage

            deployment_started=true
            migration_started=false
            restore_before_migration() {
              if [ "$migration_started" = false ] && [ "$services_stopped" = true ] && [ -n "$old_image" ]; then
                if restore_runtime_services \
                  "$old_image" "$old_release_sha" "$old_runner_release_sha" \
                  "$old_media_present"; then
                  services_stopped=false
                fi
              fi
            }
            trap restore_before_migration ERR

            start_stage quiescence
            echo "deploy preflight: validating migration plan and queue quiescence before stopping services"
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun scripts/apply-sql-migrations.ts --plan
            ledger_before=$(APP_IMAGE="$IMAGE_REF" migration_ledger_fingerprint)
            test -n "$ledger_before"
            echo "deploy preflight: migration_ledger_before=$ledger_before"
            if ! APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun scripts/assert-queue-quiescence.ts --database-only --scoped; then
              echo "deploy preflight: database work is not quiescent; services were not stopped" >&2
              exit 1
            fi
            if ! APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun scripts/assert-queue-quiescence.ts --redis-only --scoped; then
              echo "deploy preflight: queue work is not quiescent; services were not stopped" >&2
              exit 1
            fi
            echo "deploy preflight: migration plan and queue quiescence passed before stopping services"
            services_stopped=true
            # Keep the API/worker gate explicit: API bind recovery must never
            # stop a healthy worker.  (The scheduler is stopped separately.)
            APP_IMAGE="$IMAGE_REF" docker compose stop -t 45 api worker
            APP_IMAGE="$IMAGE_REF" docker compose stop -t 45 scheduler content-worker media-worker
            APP_IMAGE="$IMAGE_REF" docker compose stop -t 45 live-picks-worker official-h2h-worker
            remove_exact_stopped_container api
            wait_for_port_3000_free 30 2
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun scripts/assert-queue-quiescence.ts --database-only --scoped
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun scripts/assert-queue-quiescence.ts --redis-only --scoped
            APP_IMAGE="$IMAGE_REF" docker compose --profile migration run --rm -T backup
            finish_stage

            x_scan_setting=$(read_env_setting CONTENT_X_SCAN_ENABLED "$env_file" | tr '[:upper:]' '[:lower:]' || true)
            real_grok_setting=$(read_env_setting CONTENT_REAL_GROK_ENABLED "$env_file" | tr '[:upper:]' '[:lower:]' || true)
            if [[ "$x_scan_setting" =~ ^(1|true|yes|on)$ ]] &&
              [[ "$real_grok_setting" =~ ^(1|true|yes|on)$ ]]; then
              start_stage hostRunner
              runner_root=/home/workspace/letletme-grok-runner
              runner_previous_target=$(readlink -e "$runner_root/current" 2>/dev/null || true)
              runner_previous_release=$(cat "$runner_root/current.release" 2>/dev/null || printf unknown)
              runner_previous_release=${runner_previous_release:-unknown}
              test -x scripts/deploy-host-grok-runner.sh
              runner_updated=true
              scripts/deploy-host-grok-runner.sh "$IMAGE_REF" "$DEPLOY_SHA" \
                "$runner_root"
              test -x scripts/run-briefing-control-probe.sh
              if scripts/run-briefing-control-probe.sh \
                "$env_file" "$migration_env_file" "$DEPLOY_SHA"; then
                runner_probe_succeeded=true
                finish_stage
              else
                runner_probe_status=$?
                export CONTENT_GROK_RUNNER_RELEASE_SHA="${runner_previous_release:-unknown}"
                test -x scripts/rollback-host-grok-runner.sh
                scripts/rollback-host-grok-runner.sh \
                  "$runner_root" "$runner_previous_target" "$runner_previous_release"
                runner_updated=false
                printf '{"event":"briefing_control_probe","outcome":"degraded","exitCode":%s,"runnerRestored":true,"dataDeploymentContinues":true}\n' \
                  "$runner_probe_status"
                finish_stage degraded
              fi
            else
              echo 'deploy: host Grok runner is not required while X scanning or the real Grok provider is disabled'
            fi

            migration_started=true
            start_stage migration
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migration-contract
            finish_stage
            start_stage roleVerify
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun run db:verify-runtime-logins
            finish_stage
            start_stage cachePublish
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e "DATABASE_URL=$data_runtime_database_url" api \
              bun run cache:publish-core -- --execute --allow-empty
            finish_stage
            start_stage serviceReady
            services_start_attempted=true
            # The media worker owns a runtime heartbeat even when source-media
            # processing is disabled. Keep it in the normal forward start so
            # /ready can distinguish an intentionally disabled worker from a
            # missing or crashed worker. RUNTIME_INCLUDE_MEDIA_WORKER=false is
            # reserved for restoring a release that never had this container.
            export RUNTIME_INCLUDE_MEDIA_WORKER=true
            # The shared state machine owns the equivalent API/worker startup
            # (`docker compose up -d ...`) and preserves healthy workers on a
            # first API bind failure.
            APP_IMAGE="$IMAGE_REF" start_runtime_services
            HEALTH_ATTEMPTS=90 HEALTH_DELAY_SECONDS=2 HEALTH_DEADLINE_SECONDS=300 \
              PROJECT_DIR="$VPS_WORKDIR" COMPOSE_FILE=docker-compose.yml COMPOSE_BIN='docker compose' \
              scripts/verify-runtime-health.sh

            finish_stage
            if [[ "$x_scan_setting" =~ ^(1|true|yes|on)$ ]] &&
              [[ "$real_grok_setting" =~ ^(1|true|yes|on)$ ]] &&
              [ "$runner_probe_succeeded" = true ]; then
              test -x scripts/rearm-briefing-x-after-probe.sh
              scripts/rearm-briefing-x-after-probe.sh "$env_file" "$migration_env_file"
            elif [[ "$x_scan_setting" =~ ^(1|true|yes|on)$ ]] &&
              [[ "$real_grok_setting" =~ ^(1|true|yes|on)$ ]]; then
              printf '%s\n' '{"event":"briefing_x_rearm","outcome":"skipped","reason":"control-probe-not-successful"}'
            fi
            deployment_committed=true
            docker compose ps
            if [ -n "$old_image" ]; then
              printf '%s\n' "$old_image" > "$HOME/.letletme-data-previous-image"
              chmod 600 "$HOME/.letletme-data-previous-image"
            fi
            cleanup_obsolete_data_digests
            docker system df || true
