name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Resolve protected main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "${WORKFLOW_SHA:-$main_sha}"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push once
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --tag "${IMAGE_NAME}:latest" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"

      - name: Deploy exact image digest
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin
            cd "$VPS_WORKDIR"
            git fetch origin main
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            env_file=${ENV_FILE:-.env.deploy}
            migration_env_file=${MIGRATION_ENV_FILE:-.env.migrate}
            export ENV_FILE="$env_file"
            export MIGRATION_ENV_FILE="$migration_env_file"
            test -f "$env_file"
            test -f "$migration_env_file"

            old_container=$(docker compose ps -aq api | head -n 1)
            old_image=""
            if [ -n "$old_container" ]; then
              old_image=$(docker inspect --format '{{.Config.Image}}' "$old_container")
              test -n "$old_image"
              printf '%s\n' "$old_image" > "$HOME/.letletme-data-previous-image"
            fi

            APP_IMAGE="$IMAGE_REF" docker compose --profile migration pull api worker migration
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun scripts/migration-login-contract.ts --preflight
            data_runtime_database_url=$(APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun scripts/read-runtime-database-url.ts)
            test -n "$data_runtime_database_url"
            echo "deploy preflight: data runtime URL present"
            graphql_containers=$(docker ps --filter label=com.docker.compose.service=graphql --format '{{.ID}}')
            graphql_container_count=$(printf '%s\n' "$graphql_containers" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "deploy preflight: running GraphQL containers=$graphql_container_count"
            if [ "$graphql_container_count" -gt 1 ]; then
              echo "At most one running GraphQL container is allowed"
              exit 1
            fi
            if [ "$graphql_container_count" -eq 1 ]; then
              graphql_container=$(printf '%s\n' "$graphql_containers" | sed '/^$/d')
              graphql_runtime_database_url=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
                "$graphql_container" | sed -n 's/^DATABASE_URL=//p')
            else
              graphql_container=$(docker ps -aq --filter label=com.docker.compose.service=graphql | head -n 1)
              if [ -n "$graphql_container" ]; then
                graphql_runtime_database_url=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "$graphql_container" | sed -n 's/^DATABASE_URL=//p')
              else
                graphql_runtime_database_url=$(sed -n 's/^GRAPHQL_RUNTIME_DATABASE_URL=//p' \
                  "$migration_env_file" | sed -e 's/^"//' -e 's/"$//')
              fi
            fi
            if [ -z "$graphql_runtime_database_url" ]; then
              # Both runtime logins use the same database target. The URL may be
              # unavailable when the GraphQL container has not been deployed yet.
              graphql_runtime_database_url=$(DATA_RUNTIME_DATABASE_URL="$data_runtime_database_url" python3 - <<'PY'
            import os
            from urllib.parse import quote, urlsplit, urlunsplit

            raw_url = os.environ["DATA_RUNTIME_DATABASE_URL"]
            parsed = urlsplit(raw_url)
            if not parsed.hostname or not parsed.path or parsed.path == "/":
                raise SystemExit("Data runtime URL must include a database target")
            host = parsed.hostname
            if ":" in host:
                host = f"[{host}]"
            port = f":{parsed.port}" if parsed.port else ""
            netloc = f"{quote('letletme_graphql_runtime', safe='')}@{host}{port}"
            print(urlunsplit((parsed.scheme, netloc, parsed.path, parsed.query, parsed.fragment)), end="")
            PY
              )
            fi
            test -n "$graphql_runtime_database_url"
            echo "deploy preflight: GraphQL runtime URL present"
            graphql_runtime_database_password=$(sed -n 's/^GRAPHQL_RUNTIME_DB_PASSWORD=//p' \
              "$migration_env_file" | sed -e 's/^"//' -e 's/"$//')
            test -n "$graphql_runtime_database_password"
            echo "deploy preflight: GraphQL runtime password present"
            graphql_runtime_database_url=$(GRAPHQL_RUNTIME_DATABASE_URL="$graphql_runtime_database_url" \
              GRAPHQL_RUNTIME_DATABASE_PASSWORD="$graphql_runtime_database_password" \
              python3 - <<'PY'
            import os
            from urllib.parse import quote, unquote, urlsplit, urlunsplit

            raw_url = os.environ["GRAPHQL_RUNTIME_DATABASE_URL"]
            password = os.environ["GRAPHQL_RUNTIME_DATABASE_PASSWORD"]
            parsed = urlsplit(raw_url)
            username = unquote(parsed.username or "")
            if not parsed.hostname or not username:
                raise SystemExit("GraphQL runtime URL must include a host and username")
            host = parsed.hostname
            if ":" in host:
                host = f"[{host}]"
            port = f":{parsed.port}" if parsed.port else ""
            netloc = f"{quote(username, safe='')}:{quote(password, safe='')}@{host}{port}"
            print(urlunsplit((parsed.scheme, netloc, parsed.path, parsed.query, parsed.fragment)), end="")
            PY
            )
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e "DATA_RUNTIME_DATABASE_URL=$data_runtime_database_url" \
              -e "GRAPHQL_RUNTIME_DATABASE_URL=$graphql_runtime_database_url" migration \
              bun run db:provision-runtime-logins --preflight
            echo "deploy preflight: runtime login provisioning inputs passed"

            migration_started=false
            restore_before_migration() {
              if [ "$migration_started" = false ] && [ -n "$old_image" ]; then
                APP_IMAGE="$old_image" docker compose up -d --remove-orphans --no-build api worker || true
              fi
            }
            trap restore_before_migration ERR

            APP_IMAGE="$IMAGE_REF" docker compose stop -t 45 api worker
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration \
              bun scripts/assert-queue-quiescence.ts --database-only
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun scripts/assert-queue-quiescence.ts --redis-only
            migration_started=true
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:provision-runtime-logins
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migration-contract
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
              bun run cache:publish-core -- --execute --allow-empty
            APP_IMAGE="$IMAGE_REF" docker compose up -d --remove-orphans --no-build api worker

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3000/health >/dev/null \
                && curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker logs --tail 100 "$(docker compose ps -q api)" || true
                exit 1
              fi
              sleep 2
            done

            trap - ERR
            worker_container=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)
            test -n "$worker_container"
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_container")
              if [ "$status" = healthy ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker logs --tail 100 "$worker_container" || true
                exit 1
              fi
              sleep 2
            done

            trap - ERR
            docker compose ps
            docker image prune --force
