name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      retire_expired_core_staging_publication_ids:
        description: 'Comma-separated exact expired fpl:core staging publication UUIDs to retire'
        required: false
        type: string
      retire_expired_core_staging_season_id:
        description: 'Season ID fence for the exact staging publications'
        required: false
        type: string
      retire_expired_core_staging_active_publication_id:
        description: 'Expected active fpl:core publication UUID fence'
        required: false
        type: string
      retire_expired_core_staging_active_revision:
        description: 'Expected active fpl:core revision fence'
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      REGISTRY: ghcr.io
      LIVE_POINTS_V2_SEED_SEASON: ${{ vars.LIVE_POINTS_V2_SEED_SEASON }}
      LIVE_POINTS_V2_SEED_EVENT_ID: ${{ vars.LIVE_POINTS_V2_SEED_EVENT_ID }}
    steps:
      - name: Resolve protected main and CI gate
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test -n "${WORKFLOW_SHA:-}"
            test "$WORKFLOW_EVENT" = "push"
            test "$main_sha" = "$WORKFLOW_SHA"
          else
            ci_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$main_sha&per_page=20")
            ci_success_count=$(printf '%s' "$ci_runs" | jq --arg sha "$main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | length')
            test "$ci_success_count" -gt 0
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout protected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set image name
        run: |
          set -euo pipefail
          image_name=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$image_name" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable SHA image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${{ steps.target.outputs.sha }}" \
            --label "org.opencontainers.image.revision=${{ steps.target.outputs.sha }}" \
            --metadata-file build-metadata.json \
            --push .
          digest=$(jq -r '.["containerimage.digest"]' build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_REF=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"

      - name: Scan immutable image digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'false'
          severity: HIGH,CRITICAL

      - name: Deploy exact image digest over pinned OpenSSH
        uses: ./.github/actions/pinned-openssh
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          LIVE_POINTS_V2_SEED_SEASON: ${{ vars.LIVE_POINTS_V2_SEED_SEASON }}
          LIVE_POINTS_V2_SEED_EVENT_ID: ${{ vars.LIVE_POINTS_V2_SEED_EVENT_ID }}
          RETIRE_EXPIRED_CORE_STAGING_PUBLICATION_IDS: ${{ inputs.retire_expired_core_staging_publication_ids }}
          RETIRE_EXPIRED_CORE_STAGING_SEASON_ID: ${{ inputs.retire_expired_core_staging_season_id }}
          RETIRE_EXPIRED_CORE_STAGING_ACTIVE_PUBLICATION_ID: ${{ inputs.retire_expired_core_staging_active_publication_id }}
          RETIRE_EXPIRED_CORE_STAGING_ACTIVE_REVISION: ${{ inputs.retire_expired_core_staging_active_revision }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          private-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          timeout: 30m
          envs: DEPLOY_SHA,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,LIVE_POINTS_V2_SEED_SEASON,LIVE_POINTS_V2_SEED_EVENT_ID,RETIRE_EXPIRED_CORE_STAGING_PUBLICATION_IDS,RETIRE_EXPIRED_CORE_STAGING_SEASON_ID,RETIRE_EXPIRED_CORE_STAGING_ACTIVE_PUBLICATION_ID,RETIRE_EXPIRED_CORE_STAGING_ACTIVE_REVISION
          script: |
            set -euo pipefail
            lower_user=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$lower_user" --password-stdin
            cd "$VPS_WORKDIR"

            # This bootstrap owns only serialization and exact checkout. The
            # versioned deploy script is the single deployment/recovery path.
            source scripts/deploy-state-machine.sh
            acquire_deploy_lock
            trap 'release_deploy_lock || true' EXIT
            git fetch origin main
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            export APP_IMAGE="$IMAGE_REF"
            source scripts/deploy.sh deploy

      - name: Promote verified digest to latest
        if: success()
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_REF}"
          expected_digest="${IMAGE_REF##*@}"
          latest_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" | awk '/^Digest:/ { print $2; exit }')
          test "$latest_digest" = "$expected_digest"
