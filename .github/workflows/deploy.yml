name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  # repository_dispatch resolves the workflow and GITHUB_SHA from protected main.
  repository_dispatch:
    types:
      - v3-data-production-operation

# Never cancel a deploy mid-flight: the SSH session runs git reset, migrations
# and compose up as one critical section — interrupting it strands the VPS
# checkout/DB ahead of the running containers.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'deploy') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual dispatch ref
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "DATA_TRUSTED_MAIN_SHA=$main_sha"

      - name: Set deployment metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            # Resolve whatever ref/SHA was dispatched to a full commit SHA so
            # the image tag and the VPS git reset are unambiguous.
            DEPLOY_SHA="$(git rev-parse HEAD)"
          fi
          IMAGE_NAME=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          if [ -f migrations/0079_create_v3_ops_and_roles.sql ]; then
            if [ "${{ github.event_name }}" != "repository_dispatch" ]; then
              echo "::error::V3 deployment is manual-only and requires an approved release manifest"
              exit 1
            fi
            echo "V3_REQUIRED=true" >> "$GITHUB_ENV"
          else
            echo "V3_REQUIRED=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: env.V3_REQUIRED != 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:${DEPLOY_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            --push .
          echo "IMAGE_REF=${IMAGE_NAME}:${DEPLOY_SHA}" >> "$GITHUB_ENV"

      - name: Select frozen v3 candidate image
        if: env.V3_REQUIRED == 'true'
        env:
          V3_IMAGE_REF_INPUT: ${{ github.event.client_payload.v3_image_ref }}
        run: |
          if [[ ! "$V3_IMAGE_REF_INPUT" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::v3_image_ref must be a lowercase GHCR reference pinned by sha256 digest"
            exit 1
          fi
          echo "IMAGE_REF=$V3_IMAGE_REF_INPUT" >> "$GITHUB_ENV"
          echo "DEPLOY_IMAGE_DIGEST=${V3_IMAGE_REF_INPUT##*@}" >> "$GITHUB_ENV"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Expected deployment config:
          # vars.VPS_HOST=data.internal.example
          # vars.VPS_USER=deploy
          # vars.VPS_WORKDIR=/home/workspace/letletme_data
          # secrets.VPS_SSH_KEY=<private key for deploy>
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          DEPLOY_IMAGE_DIGEST: ${{ env.DEPLOY_IMAGE_DIGEST }}
          V3_CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id || '' }}
          V3_RELEASE_MANIFEST_BASE64: ${{ github.event.client_payload.v3_release_manifest_base64 || '' }}
          V3_RELEASE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_release_manifest_sha256 || '' }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval || '' }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_SHA,DEPLOY_IMAGE_DIGEST,IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,V3_CUTOVER_RUN_ID,V3_RELEASE_MANIFEST_BASE64,V3_RELEASE_MANIFEST_SHA256,V3_CUTOVER_APPROVAL
          script: |
            set -euo pipefail
            LOWER_USER=$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            cd "$VPS_WORKDIR"
            git fetch --all
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            test -f .env.migrate || { echo "Missing isolated .env.migrate"; exit 1; }
            APP_IMAGE="$IMAGE_REF" docker compose pull api worker migration
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            if [ -f migrations/0079_create_v3_ops_and_roles.sql ]; then
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
                -e DEPLOY_SHA="$DEPLOY_SHA" \
                -e DEPLOY_IMAGE_DIGEST="$DEPLOY_IMAGE_DIGEST" \
                -e V3_CUTOVER_RUN_ID="$V3_CUTOVER_RUN_ID" \
                -e V3_RELEASE_MANIFEST_BASE64="$V3_RELEASE_MANIFEST_BASE64" \
                -e V3_RELEASE_MANIFEST_SHA256="$V3_RELEASE_MANIFEST_SHA256" \
                -e V3_CUTOVER_APPROVAL="$V3_CUTOVER_APPROVAL" \
                migration bun scripts/v3-release-gate.ts
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
                migration bun run db:migration-contract
            fi
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun scripts/apply-sql-migrations.ts
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status
            APP_IMAGE="$IMAGE_REF" docker compose up -d --remove-orphans --no-build
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed after waiting for startup"
                APP_IMAGE="$IMAGE_REF" docker compose ps
                docker logs --tail 100 letletme_data-api-1 || true
                exit 1
              fi
              sleep 2
            done

            # The worker exposes no HTTP port; assert its Docker healthcheck
            # (heartbeat file mtime, see docker-compose.yml) reports healthy.
            WORKER_CID=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)
            if [ -z "$WORKER_CID" ]; then
              echo "Worker container not found after deploy"
              APP_IMAGE="$IMAGE_REF" docker compose ps
              exit 1
            fi
            for attempt in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$WORKER_CID" 2>/dev/null || echo unknown)
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Worker health check failed after waiting for startup (last status: $STATUS)"
                APP_IMAGE="$IMAGE_REF" docker compose ps
                docker logs --tail 100 "$WORKER_CID" || true
                exit 1
              fi
              sleep 2
            done
            APP_IMAGE="$IMAGE_REF" docker compose ps

            # Targeted prune: keep the newest 3 commit-tagged copies of the app
            # image (current deploy + 2 local rollback candidates); GHCR stays
            # the full archive. Dangling layers are always pruned.
            IMAGE_NAME="${IMAGE_REF%:*}"
            KEEP_TAGS=3
            mapfile -t image_rows < <(
              docker images "$IMAGE_NAME" --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' \
                | grep -E ':[0-9a-f]{40}$' \
                | sort -r || true
            )
            for ((i = KEEP_TAGS; i < ${#image_rows[@]}; i++)); do
              OLD_REF="${image_rows[$i]#*|}"
              echo "Pruning old image $OLD_REF"
              docker rmi "$OLD_REF" >/dev/null 2>&1 || true
            done
            docker image prune --force

  v3_publish_image:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-publish-image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout frozen Data candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false

      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "V3_DATA_TRUSTED_MAIN_SHA=$main_sha"

      - name: Resolve immutable image metadata
        run: |
          set -euo pipefail
          DEPLOY_SHA=$(git rev-parse HEAD)
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve an exact Data candidate commit"
            exit 1
          fi
          IMAGE_NAME=$(printf '%s' "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_NAME}:v3-${DEPLOY_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact amd64 candidate
        run: |
          set -euo pipefail
          metadata_file=$(mktemp)
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE_TAG" \
            --provenance=false \
            --push \
            --metadata-file "$metadata_file" \
            .
          digest=$(jq -r '."containerimage.digest"' "$metadata_file")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return an immutable registry digest"
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_NAME}@${digest}"
          {
            echo "### Frozen Data image"
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Immutable ref: \`${IMAGE_NAME}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  v3_preflight:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect production VPS without changing checkout or services
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: VPS_WORKDIR
          script: |
            set -euo pipefail
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            echo "V3_PREFLIGHT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "V3_PREFLIGHT_HOST=$(hostname)"
            echo "V3_PREFLIGHT_COMMIT=$(git rev-parse HEAD)"
            echo "V3_PREFLIGHT_BRANCH=$(git symbolic-ref --short -q HEAD || echo detached)"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "V3_PREFLIGHT_TRACKED_WORKTREE=dirty"
            else
              echo "V3_PREFLIGHT_TRACKED_WORKTREE=clean"
            fi
            echo "V3_PREFLIGHT_UNTRACKED"
            git ls-files --others --exclude-standard
            echo "V3_PREFLIGHT_DISK"
            df -h "$VPS_WORKDIR"
            echo "V3_PREFLIGHT_DOCKER=$(docker version --format '{{.Server.Version}}')"
            echo "V3_PREFLIGHT_COMPOSE=$(docker compose version --short)"
            echo "V3_PREFLIGHT_SERVICES"
            docker compose config --services
            docker compose ps --all
            for service in api worker; do
              cid=$(docker compose ps -q --all "$service")
              if [ -z "$cid" ]; then
                echo "V3_PREFLIGHT_${service}=absent"
                continue
              fi
              docker inspect --format \
                'V3_PREFLIGHT_CONTAINER={{.Name}} image={{.Config.Image}} image_id={{.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$cid"
            done
            for env_file in .env.deploy .env.migrate; do
              if [ -f "$env_file" ]; then
                mode=$(stat -c '%a' "$env_file" 2>/dev/null || echo unknown)
                echo "V3_PREFLIGHT_ENV_FILE=$env_file present mode=$mode"
                while IFS='=' read -r key _; do
                  case "$key" in
                    DATABASE_URL|CACHE_REDIS_HOST|CACHE_REDIS_PORT|CACHE_REDIS_PASSWORD|CACHE_REDIS_DB|QUEUE_REDIS_HOST|QUEUE_REDIS_PORT|QUEUE_REDIS_PASSWORD|QUEUE_REDIS_DB|REDIS_HOST|REDIS_PORT|REDIS_PASSWORD|REDIS_DB)
                      echo "V3_PREFLIGHT_ENV_KEY=$key"
                      ;;
                  esac
                done < "$env_file"
              else
                echo "V3_PREFLIGHT_ENV_FILE=$env_file missing"
              fi
            done
            data_http=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health || true)
            graphql_http=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/health || true)
            echo "V3_PREFLIGHT_DATA_HEALTH_HTTP=$data_http"
            echo "V3_PREFLIGHT_GRAPHQL_HEALTH_HTTP=$graphql_http"
            echo "V3_PREFLIGHT_PORTS"
            docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}'

  v3_activate_database:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-activate-database'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout frozen Data candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha }}

      - name: Resolve exact candidate commit and image
        env:
          V3_IMAGE_REF_INPUT: ${{ github.event.client_payload.v3_image_ref }}
        run: |
          set -euo pipefail
          DEPLOY_SHA=$(git rev-parse HEAD)
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve an exact Data candidate commit"
            exit 1
          fi
          if [[ ! "$V3_IMAGE_REF_INPUT" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::v3_image_ref must be an immutable lowercase GHCR digest reference"
            exit 1
          fi
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$V3_IMAGE_REF_INPUT" >> "$GITHUB_ENV"
          echo "DEPLOY_IMAGE_DIGEST=${V3_IMAGE_REF_INPUT##*@}" >> "$GITHUB_ENV"

      - name: Stop Data and activate database only
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          IMAGE_REF: ${{ env.IMAGE_REF }}
          DEPLOY_IMAGE_DIGEST: ${{ env.DEPLOY_IMAGE_DIGEST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          V3_CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          V3_RELEASE_MANIFEST_BASE64: ${{ github.event.client_payload.v3_release_manifest_base64 }}
          V3_RELEASE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_release_manifest_sha256 }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval }}
          V3_MIGRATION_ENV: ${{ secrets.V3_MIGRATION_ENV }}
          V3_DATA_DB_PASSWORD: ${{ secrets.V3_DATA_DB_PASSWORD }}
          V3_GRAPHQL_DB_PASSWORD: ${{ secrets.V3_GRAPHQL_DB_PASSWORD }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: DEPLOY_SHA,IMAGE_REF,DEPLOY_IMAGE_DIGEST,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR,V3_CUTOVER_RUN_ID,V3_RELEASE_MANIFEST_BASE64,V3_RELEASE_MANIFEST_SHA256,V3_CUTOVER_APPROVAL,V3_MIGRATION_ENV,V3_DATA_DB_PASSWORD,V3_GRAPHQL_DB_PASSWORD
          script: |
            set -euo pipefail
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            [[ "$V3_CUTOVER_RUN_ID" =~ ^v3-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,12}$ ]]
            test "$V3_CUTOVER_APPROVAL" = "APPROVE_V3_ACTIVATION $V3_CUTOVER_RUN_ID"
            git diff --quiet || { echo "Data VPS checkout has tracked modifications"; exit 1; }
            git diff --cached --quiet || { echo "Data VPS index has staged modifications"; exit 1; }
            test -f .env.deploy || { echo "Missing .env.deploy"; exit 1; }
            test -n "$V3_MIGRATION_ENV" || { echo "Missing V3_MIGRATION_ENV secret"; exit 1; }
            [[ "$V3_DATA_DB_PASSWORD" =~ ^[A-Za-z0-9_-]{64}$ ]]
            [[ "$V3_GRAPHQL_DB_PASSWORD" =~ ^[A-Za-z0-9_-]{64}$ ]]
            test "$V3_DATA_DB_PASSWORD" != "$V3_GRAPHQL_DB_PASSWORD"
            if docker ps --format '{{.Ports}}' | grep -q '127.0.0.1:4000->'; then
              echo "GraphQL is still running on port 4000; stop it before database activation"
              exit 1
            fi
            docker pull "$IMAGE_REF"
            docker run --rm \
              -e DEPLOY_SHA="$DEPLOY_SHA" \
              -e DEPLOY_IMAGE_DIGEST="$DEPLOY_IMAGE_DIGEST" \
              -e V3_CUTOVER_RUN_ID="$V3_CUTOVER_RUN_ID" \
              -e V3_RELEASE_MANIFEST_BASE64="$V3_RELEASE_MANIFEST_BASE64" \
              -e V3_RELEASE_MANIFEST_SHA256="$V3_RELEASE_MANIFEST_SHA256" \
              -e V3_CUTOVER_APPROVAL="$V3_CUTOVER_APPROVAL" \
              "$IMAGE_REF" bun scripts/v3-release-gate.ts
            migration_status_env=$(mktemp)
            trap 'rm -f "$migration_status_env"' EXIT
            printf '%s\n' "$V3_MIGRATION_ENV" > "$migration_status_env"
            chmod 600 "$migration_status_env"
            set +e
            migration_status_output=$(MIGRATION_ENV_FILE="$migration_status_env" \
              APP_IMAGE="$IMAGE_REF" \
              docker compose run --rm -T migration bun run db:migrate:status 2>&1)
            migration_status_exit=$?
            set -e
            printf '%s\n' "$migration_status_output"
            rm -f "$migration_status_env"
            trap - EXIT
            if [ "$migration_status_exit" -ne 0 ] && [ "$migration_status_exit" -ne 1 ]; then
              echo "Unexpected preactivation migration status exit: $migration_status_exit"
              exit 1
            fi
            if printf '%s\n' "$migration_status_output" \
              | grep -Eq '^(missing|backdated|mismatch|legacy)[[:space:]]+'; then
              echo "Production migration history is unsafe for v3 activation"
              exit 1
            fi
            for required_migration in \
              0079_align_fpl_event_history.sql \
              0079_create_v3_ops_and_roles.sql \
              0090_zzzz_integrate_understat_runtime.sql; do
              if ! printf '%s\n' "$migration_status_output" \
                | grep -Eq "^(applied|pending)[[:space:]]+$required_migration$"; then
                echo "Required migration is absent from the candidate status: $required_migration"
                exit 1
              fi
            done
            for gated_migration in \
              0091_drop_v2_reporting_and_rpcs.sql \
              0092_drop_v2_tables_partitions_triggers.sql \
              0093_finalize_v3_migration_ownership.sql; do
              if ! printf '%s\n' "$migration_status_output" \
                | grep -Eq "^gated[[:space:]]+$gated_migration "; then
                echo "Legacy cleanup migration is not gated: $gated_migration"
                exit 1
              fi
            done
            echo "V3_PREACTIVATION_MIGRATION_HISTORY=compatible"
            config_backup_dir="$(dirname "$VPS_WORKDIR")/v3-cutover/$V3_CUTOVER_RUN_ID/data"
            install -d -m 700 "$config_backup_dir"
            install -m 600 .env.deploy "$config_backup_dir/env.deploy.before-v3"
            sha256sum "$config_backup_dir/env.deploy.before-v3" > "$config_backup_dir/env.deploy.before-v3.sha256"
            if [ -f .env.migrate ]; then
              install -m 600 .env.migrate "$config_backup_dir/env.migrate.before-v3"
              sha256sum "$config_backup_dir/env.migrate.before-v3" > "$config_backup_dir/env.migrate.before-v3.sha256"
            fi
            migration_tmp=$(mktemp "$VPS_WORKDIR/.env.migrate.v3.XXXXXX")
            printf '%s\n' "$V3_MIGRATION_ENV" > "$migration_tmp"
            chmod 600 "$migration_tmp"
            mv "$migration_tmp" .env.migrate
            git fetch --all
            untracked_file=$(mktemp)
            target_file=$(mktemp)
            conflict_file=$(mktemp)
            git ls-files --others --exclude-standard | sort -u > "$untracked_file"
            git ls-tree -r --name-only "$DEPLOY_SHA" | sort -u > "$target_file"
            comm -12 "$untracked_file" "$target_file" > "$conflict_file"
            if [ -s "$conflict_file" ]; then
              echo "Untracked production files conflict with the frozen candidate:"
              cat "$conflict_file"
              exit 1
            fi
            git checkout --force main
            git reset --hard "$DEPLOY_SHA"
            APP_IMAGE="$IMAGE_REF" docker compose pull api worker migration
            command -v python3 >/dev/null
            env_tmp=$(mktemp "$VPS_WORKDIR/.env.deploy.v3.XXXXXX")
            python3 - .env.deploy "$env_tmp" <<'PY'
            import os
            import re
            import sys
            from urllib.parse import quote, unquote, urlsplit, urlunsplit

            source_path, target_path = sys.argv[1:]
            with open(source_path, encoding='utf-8') as source:
                lines = source.read().splitlines()

            values = {}
            for line in lines:
                if not line or line.lstrip().startswith('#') or '=' not in line:
                    continue
                key, value = line.split('=', 1)
                values[key] = value

            required = (
                'DATABASE_URL',
                'REDIS_HOST',
                'REDIS_PORT',
                'QUEUE_REDIS_HOST',
                'QUEUE_REDIS_PORT',
            )
            missing = [key for key in required if not values.get(key)]
            if missing:
                raise SystemExit(f"Missing production runtime settings: {', '.join(missing)}")

            password = os.environ.get('V3_DATA_DB_PASSWORD', '')
            if not re.fullmatch(r'[A-Za-z0-9_-]{64}', password):
                raise SystemExit('Invalid V3_DATA_DB_PASSWORD')

            source_database_url = values['DATABASE_URL']
            if (
                len(source_database_url) >= 2
                and source_database_url[0] == source_database_url[-1]
                and source_database_url[0] in ('"', "'")
            ):
                source_database_url = source_database_url[1:-1]
            parsed = urlsplit(source_database_url)
            current_user = unquote(parsed.username or '')
            match = re.fullmatch(
                r'(?:postgres|letletme_data_runtime)\.([a-z0-9]{8,64})',
                current_user,
            )
            if (
                parsed.scheme not in ('postgres', 'postgresql')
                or not parsed.hostname
                or not match
            ):
                raise SystemExit('DATABASE_URL is not the expected Supabase pooler URL')
            project_ref = match.group(1)
            runtime_user = f'letletme_data_runtime.{project_ref}'
            host = parsed.hostname
            if ':' in host:
                host = f'[{host}]'
            if parsed.port is not None:
                host = f'{host}:{parsed.port}'
            runtime_url = urlunsplit(
                (
                    parsed.scheme,
                    f'{quote(runtime_user, safe="")}:{quote(password, safe="")}@{host}',
                    parsed.path,
                    parsed.query,
                    parsed.fragment,
                )
            )

            replaced = {
                'DATABASE_URL',
                'CACHE_REDIS_HOST',
                'CACHE_REDIS_PORT',
                'CACHE_REDIS_PASSWORD',
                'CACHE_REDIS_DB',
                'QUEUE_REDIS_DB',
            }
            output = [
                line
                for line in lines
                if not ('=' in line and line.split('=', 1)[0] in replaced)
            ]
            output.extend(
                [
                    f'DATABASE_URL={runtime_url}',
                    f"CACHE_REDIS_HOST={values['REDIS_HOST']}",
                    f"CACHE_REDIS_PORT={values['REDIS_PORT']}",
                    'CACHE_REDIS_DB=0',
                    'QUEUE_REDIS_DB=1',
                ]
            )
            if values.get('REDIS_PASSWORD'):
                output.append(f"CACHE_REDIS_PASSWORD={values['REDIS_PASSWORD']}")

            descriptor = os.open(target_path, os.O_WRONLY | os.O_TRUNC, 0o600)
            with os.fdopen(descriptor, 'w', encoding='utf-8') as target:
                target.write('\n'.join(output) + '\n')
            PY
            chmod 600 "$env_tmp"
            mv "$env_tmp" .env.deploy
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migration-contract
            APP_IMAGE="$IMAGE_REF" docker compose stop -t 30 worker
            APP_IMAGE="$IMAGE_REF" docker compose stop -t 30 api
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q api)"
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun scripts/apply-sql-migrations.ts
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e CUTOVER_RUN_ID="$V3_CUTOVER_RUN_ID" \
              -e V3_CUTOVER_APPROVAL="$V3_CUTOVER_APPROVAL" \
              -e V3_DATA_DB_PASSWORD="$V3_DATA_DB_PASSWORD" \
              -e V3_GRAPHQL_DB_PASSWORD="$V3_GRAPHQL_DB_PASSWORD" \
              migration bun run db:provision-runtime-logins
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q api)"
            echo "V3_DATABASE_ACTIVATED=$V3_CUTOVER_RUN_ID"
            echo "V3_DATA_SERVICES=stopped"

  v3_redis_queues:
    if: >-
      github.event_name == 'repository_dispatch' &&
      (github.event.client_payload.operation == 'v3-copy-queues-dry-run' || github.event.client_payload.operation == 'v3-copy-queues-execute')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Copy or inspect legacy queues with exact manifest gating
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPERATION: ${{ github.event.client_payload.operation }}
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          QUEUE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_queue_manifest_sha256 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: OPERATION,IMAGE_REF,QUEUE_MANIFEST_SHA256,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            cd "$VPS_WORKDIR"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)" || { echo "Worker must remain stopped"; exit 1; }
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull api
            run_redis_cutover() {
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
                -e V3_REDIS_QUEUE_MANIFEST_SHA256="$QUEUE_MANIFEST_SHA256" \
                api sh -eu -c '
                  export CACHE_REDIS_HOST="${CACHE_REDIS_HOST:-${REDIS_HOST:-}}"
                  export CACHE_REDIS_PORT="${CACHE_REDIS_PORT:-${REDIS_PORT:-6379}}"
                  export CACHE_REDIS_PASSWORD="${CACHE_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}"
                  export CACHE_REDIS_DB="${CACHE_REDIS_DB:-${REDIS_DB:-0}}"
                  export QUEUE_REDIS_HOST="${QUEUE_REDIS_HOST:-${REDIS_HOST:-}}"
                  export QUEUE_REDIS_PORT="${QUEUE_REDIS_PORT:-${REDIS_PORT:-6379}}"
                  export QUEUE_REDIS_PASSWORD="${QUEUE_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}"
                  export QUEUE_REDIS_DB="${QUEUE_REDIS_DB:-1}"
                  exec bun run redis:cutover "$@"
                ' sh "$@"
            }
            if [ "$OPERATION" = "v3-copy-queues-dry-run" ]; then
              run_redis_cutover copy-queues
              exit 0
            fi
            [[ "$QUEUE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            run_redis_cutover copy-queues --execute
            run_redis_cutover verify-queues

  v3_core_cache:
    if: >-
      github.event_name == 'repository_dispatch' &&
      (github.event.client_payload.operation == 'v3-publish-core-dry-run' || github.event.client_payload.operation == 'v3-publish-core-execute')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect or publish immutable core cache
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPERATION: ${{ github.event.client_payload.operation }}
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          CORE_CACHE_APPROVAL: ${{ github.event.client_payload.v3_core_cache_approval }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: OPERATION,IMAGE_REF,CUTOVER_RUN_ID,CORE_CACHE_APPROVAL,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            cd "$VPS_WORKDIR"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)" || { echo "Worker must remain stopped"; exit 1; }
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull api
            if [ "$OPERATION" = "v3-publish-core-dry-run" ]; then
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
                -e CUTOVER_RUN_ID="$CUTOVER_RUN_ID" \
                api bun run cache:publish-core
              exit 0
            fi
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e CUTOVER_RUN_ID="$CUTOVER_RUN_ID" \
              -e V3_CORE_CACHE_APPROVAL="$CORE_CACHE_APPROVAL" \
              api bun run cache:publish-core --execute
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun --eval '
              import { createHash } from "node:crypto";
              import { redisSingleton } from "./src/cache/singleton";

              const activeKey = "llm:v3:data:fpl:core:2627:active";
              const redis = await redisSingleton.getClient();
              try {
                const activePayload = await redis.get(activeKey);
                if (!activePayload) throw new Error("Active core publication pointer is missing");
                const manifest = JSON.parse(activePayload);
                if (
                  manifest.schemaVersion !== "v3" ||
                  manifest.planVersion !== "3.2.5" ||
                  manifest.dataset !== "fpl:core" ||
                  manifest.seasonCode !== "2627" ||
                  manifest.eventId !== null ||
                  manifest.revision !== 2 ||
                  !Array.isArray(manifest.items) ||
                  manifest.items.length !== 6
                ) {
                  throw new Error("Active core publication manifest is invalid");
                }

                const rows = [];
                for (const key of [activeKey, ...manifest.items.map((item) => item.key)]) {
                  const [type, pttl, payload] = await Promise.all([
                    redis.type(key),
                    redis.pttl(key),
                    redis.get(key),
                  ]);
                  if (type !== "string" || pttl !== -1 || payload === null) {
                    throw new Error("Core cache key type/TTL contract failed for " + key);
                  }
                  const item = manifest.items.find((candidate) => candidate.key === key);
                  if (
                    item &&
                    (Buffer.byteLength(payload, "utf8") !== item.bytes ||
                      createHash("sha256").update(payload, "utf8").digest("hex") !== item.sha256)
                  ) {
                    throw new Error("Core cache payload contract failed for " + key);
                  }
                  rows.push({ key, type, pttl, bytes: Buffer.byteLength(payload, "utf8") });
                }
                console.log(
                  JSON.stringify({
                    status: "v3_core_cache_contract_passed",
                    publicationId: manifest.publicationId,
                    revision: manifest.revision,
                    keyCount: rows.length,
                    rows,
                  }),
                );
              } finally {
                await redisSingleton.disconnect();
              }
            '

  v3_start_api:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-start-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Start Data API while keeping worker stopped
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          QUEUE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_queue_manifest_sha256 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: IMAGE_REF,QUEUE_MANIFEST_SHA256,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            [[ "$QUEUE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            cd "$VPS_WORKDIR"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)" || { echo "Worker started before API gate"; exit 1; }
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull api
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e V3_REDIS_QUEUE_MANIFEST_SHA256="$QUEUE_MANIFEST_SHA256" \
              api bun run redis:cutover verify-queues
            APP_IMAGE="$IMAGE_REF" docker compose up -d --no-deps --no-build api
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                APP_IMAGE="$IMAGE_REF" docker compose logs --tail 100 api || true
                exit 1
              fi
              sleep 2
            done
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)"

            assert_status() {
              expected="$1"
              method="$2"
              url="$3"
              actual=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --request "$method" "$url")
              if [ "$actual" != "$expected" ]; then
                echo "Unexpected HTTP status for $method $url: expected $expected, got $actual"
                exit 1
              fi
            }

            assert_status 200 GET http://127.0.0.1:3000/health
            assert_status 200 GET http://127.0.0.1:3000/ready
            curl --fail --silent http://127.0.0.1:3000/ready | grep -q '"status":"ready"'
            curl --fail --silent http://127.0.0.1:3000/events/current | grep -q '"success":true'
            curl --fail --silent http://127.0.0.1:3000/events/next | grep -q '"success":true'
            assert_status 401 POST http://127.0.0.1:3000/jobs/events-sync/trigger
            assert_status 400 GET http://127.0.0.1:3000/tournaments/check-name

            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e V3_REDIS_QUEUE_MANIFEST_SHA256="$QUEUE_MANIFEST_SHA256" \
              api bun run redis:cutover verify-queues
            echo 'V3_DATA_HTTP_CONTRACT=health:200,ready:200,current:200,next:200,unauthorized:401,malformed:400,queue:exact'
            APP_IMAGE="$IMAGE_REF" docker compose ps api worker

  v3_start_worker:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-start-worker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Start Data worker last
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          QUEUE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_queue_manifest_sha256 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: IMAGE_REF,QUEUE_MANIFEST_SHA256,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            [[ "$QUEUE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            cd "$VPS_WORKDIR"
            curl --fail --silent http://127.0.0.1:3000/health >/dev/null
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e V3_REDIS_QUEUE_MANIFEST_SHA256="$QUEUE_MANIFEST_SHA256" \
              api bun run redis:cutover verify-queues
            APP_IMAGE="$IMAGE_REF" docker compose pull worker
            APP_IMAGE="$IMAGE_REF" docker compose up -d --no-deps --no-build worker
            worker_cid=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)
            test -n "$worker_cid"
            for attempt in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_cid" 2>/dev/null || echo unknown)
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs --tail 100 "$worker_cid" || true
                exit 1
              fi
              sleep 2
            done
            APP_IMAGE="$IMAGE_REF" docker compose ps api worker

  v3_redeploy:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-redeploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Redeploy activated v3 runtime without database migration
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          EXPECTED_IMAGE_NAME: ghcr.io/tonglam/letletme_data
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: EXPECTED_SHA,IMAGE_REF,EXPECTED_IMAGE_NAME,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          command_timeout: 15m
          script: |
            set -euo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            test "${IMAGE_REF%@*}" = "$EXPECTED_IMAGE_NAME"
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            test -f .env.deploy
            git diff --quiet || { echo "Data VPS checkout has tracked modifications"; exit 1; }
            git diff --cached --quiet || { echo "Data VPS index has staged modifications"; exit 1; }

            git fetch origin main
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
            untracked_file=$(mktemp)
            target_file=$(mktemp)
            conflict_file=$(mktemp)
            trap 'rm -f "$untracked_file" "$target_file" "$conflict_file"' EXIT
            git ls-files --others --exclude-standard | sort -u > "$untracked_file"
            git ls-tree -r --name-only "$EXPECTED_SHA" | sort -u > "$target_file"
            comm -12 "$untracked_file" "$target_file" > "$conflict_file"
            if [ -s "$conflict_file" ]; then
              echo "Untracked production files conflict with the merged main target:"
              cat "$conflict_file"
              exit 1
            fi

            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            EXPECTED_TAG="${EXPECTED_IMAGE_NAME}:v3-${EXPECTED_SHA}"
            docker pull "$EXPECTED_TAG"
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$EXPECTED_TAG" | grep -Fx "$IMAGE_REF"
            docker pull "$IMAGE_REF"

            docker compose stop -t 30 worker
            docker compose stop -t 30 api
            test -z "$(docker compose ps -q worker)"
            test -z "$(docker compose ps -q api)"

            git checkout --force main
            git reset --hard "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            APP_IMAGE="$IMAGE_REF" docker compose pull api worker
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api bun run env:check
            LIVE_QUEUE_MANIFEST_SHA256=$(
              APP_IMAGE="$IMAGE_REF" docker compose run --rm -T api \
                bun scripts/v3-redis-cutover.ts inspect-queues --runtime-stable --digest-only
            )
            [[ "$LIVE_QUEUE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            echo "Captured quiesced queue manifest: $LIVE_QUEUE_MANIFEST_SHA256"
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              -e V3_REDIS_QUEUE_MANIFEST_SHA256="$LIVE_QUEUE_MANIFEST_SHA256" \
              api bun run redis:cutover verify-queues --runtime-stable

            APP_IMAGE="$IMAGE_REF" docker compose up -d --no-deps --no-build api
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                APP_IMAGE="$IMAGE_REF" docker compose logs --tail 100 api || true
                exit 1
              fi
              sleep 2
            done

            assert_status() {
              expected="$1"
              method="$2"
              url="$3"
              actual=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --request "$method" "$url")
              if [ "$actual" != "$expected" ]; then
                echo "Unexpected HTTP status for $method $url: expected $expected, got $actual"
                exit 1
              fi
            }

            assert_status 200 GET http://127.0.0.1:3000/health
            assert_status 200 GET http://127.0.0.1:3000/ready
            curl --fail --silent http://127.0.0.1:3000/ready | grep -q '"status":"ready"'
            curl --fail --silent http://127.0.0.1:3000/events/current | grep -q '"success":true'
            curl --fail --silent http://127.0.0.1:3000/events/next | grep -q '"success":true'
            assert_status 401 POST http://127.0.0.1:3000/jobs/events-sync/trigger
            assert_status 400 GET http://127.0.0.1:3000/tournaments/check-name
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null

            APP_IMAGE="$IMAGE_REF" docker compose up -d --no-deps --no-build worker
            worker_cid=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)
            test -n "$worker_cid"
            for attempt in $(seq 1 30); do
              status=$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$worker_cid" 2>/dev/null || echo unknown)
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs --tail 100 "$worker_cid" || true
                exit 1
              fi
              sleep 2
            done

            # The stable payload manifest is captured and verified while every queue producer is
            # stopped. Only BullMQ's expiring stalled-check leases are excluded; the exact
            # pre-activation cutover manifest remains a separate immutable acceptance artifact.
            api_cid=$(APP_IMAGE="$IMAGE_REF" docker compose ps -q api)
            test -n "$api_cid"
            test "$(docker inspect --format '{{.Config.Image}}' "$api_cid")" = "$IMAGE_REF"
            test "$(docker inspect --format '{{.Config.Image}}' "$worker_cid")" = "$IMAGE_REF"
            echo "V3_DATA_REDEPLOY=passed sha=$EXPECTED_SHA image=$IMAGE_REF"
            APP_IMAGE="$IMAGE_REF" docker compose ps api worker

  v3_status:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-status'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Read production migration and service status
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            cd "$VPS_WORKDIR"
            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull migration
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status
            echo "V3_STATUS_COMMIT=$(git rev-parse HEAD)"
            APP_IMAGE="$IMAGE_REF" docker compose ps --all
            echo "V3_STATUS_DATA_HTTP=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
            echo "V3_STATUS_GRAPHQL_HTTP=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/health || true)"

  v3_terminal_acceptance:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-terminal-acceptance'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Run read-only production terminal acceptance
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          DATA_IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          GRAPHQL_IMAGE_REF: ${{ github.event.client_payload.v3_graphql_image_ref }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          EXPECTED_QUEUE_SOURCE_MANIFEST: ${{ github.event.client_payload.v3_queue_manifest_sha256 }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: EXPECTED_SHA,DATA_IMAGE_REF,GRAPHQL_IMAGE_REF,CUTOVER_RUN_ID,EXPECTED_QUEUE_SOURCE_MANIFEST,VPS_WORKDIR
          command_timeout: 20m
          script: |
            set -euo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$DATA_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            [[ "$GRAPHQL_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            [[ "$CUTOVER_RUN_ID" =~ ^v3-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,12}$ ]]
            [[ "$EXPECTED_QUEUE_SOURCE_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            test -f .env.migrate

            api_cid=$(APP_IMAGE="$DATA_IMAGE_REF" docker compose ps -q api)
            worker_cid=$(APP_IMAGE="$DATA_IMAGE_REF" docker compose ps -q worker)
            test -n "$api_cid"
            test -n "$worker_cid"
            test "$(docker inspect --format '{{.Config.Image}}' "$api_cid")" = "$DATA_IMAGE_REF"
            test "$(docker inspect --format '{{.Config.Image}}' "$worker_cid")" = "$DATA_IMAGE_REF"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$api_cid")" = 'healthy'
            test "$(docker inspect --format '{{.State.Health.Status}}' "$worker_cid")" = 'healthy'

            graphql_count=$(docker ps \
              --filter label=com.docker.compose.service=graphql \
              --format '{{.ID}}' | wc -l | tr -d ' ')
            test "$graphql_count" -eq 1
            graphql_cid=$(docker ps \
              --filter label=com.docker.compose.service=graphql \
              --format '{{.ID}}')
            test "$(docker inspect --format '{{.Config.Image}}' "$graphql_cid")" = "$GRAPHQL_IMAGE_REF"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$graphql_cid")" = 'healthy'
            curl --fail --silent http://127.0.0.1:3000/health >/dev/null
            curl --fail --silent http://127.0.0.1:4000/health >/dev/null

            web_probe=$(curl --fail --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"query":"query TerminalCacheProbe { playersForPicker(search: \"Gabriel\", limit: 1) { items { id webName } totalCount } marketPulse(days: 13) { coverage { requestedDays observedDays stale } } }"}' \
              https://letletme.top/api/graphql)
            printf '%s' "$web_probe" | grep -q '"webName":"Gabriel"'
            printf '%s' "$web_probe" | grep -q '"requestedDays":13'
            if printf '%s' "$web_probe" | grep -q '"errors"'; then
              echo 'Terminal Web GraphQL cache probe returned errors'
              exit 1
            fi
            echo 'V3_TERMINAL_WEB_PROXY=passed'

            APP_IMAGE="$DATA_IMAGE_REF" docker compose exec -T \
              -e EXPECTED_QUEUE_SOURCE_MANIFEST="$EXPECTED_QUEUE_SOURCE_MANIFEST" \
              api bun --eval '
              import { createHash } from "node:crypto";
              import Redis from "ioredis";
              import { inspectLegacyRedisQueues } from "./src/cache/legacy-cleanup";
              import {
                getConfig,
                resolveCacheRedisConfig,
                resolveQueueRedisConfig,
              } from "./src/utils/config";

              const scanKeys = async (redis, pattern) => {
                let cursor = "0";
                const keys = new Set();
                do {
                  const [next, batch] = await redis.scan(
                    cursor,
                    "MATCH",
                    pattern,
                    "COUNT",
                    500,
                  );
                  cursor = next;
                  batch.forEach((key) => keys.add(key));
                } while (cursor !== "0");
                return [...keys].sort();
              };

              const config = getConfig();
              const cacheEndpoint = resolveCacheRedisConfig(config);
              const queueEndpoint = resolveQueueRedisConfig(config);
              const cacheIdentity = `${cacheEndpoint.host.toLowerCase()}:${cacheEndpoint.port}/${cacheEndpoint.db}`;
              const queueIdentity = `${queueEndpoint.host.toLowerCase()}:${queueEndpoint.port}/${queueEndpoint.db}`;
              if (cacheIdentity === queueIdentity) throw new Error("Redis endpoints are not separated");

              const cacheRedis = new Redis({ ...cacheEndpoint, lazyConnect: true });
              const queueRedis = new Redis({ ...queueEndpoint, lazyConnect: true });
              try {
                await Promise.all([cacheRedis.connect(), queueRedis.connect()]);
                const pings = await Promise.all([cacheRedis.ping(), queueRedis.ping()]);
                if (pings.some((value) => value !== "PONG")) throw new Error("Redis ping failed");

                const sourceManifest = await inspectLegacyRedisQueues(cacheRedis, { maxKeys: 10000 });
                if (
                  sourceManifest.keyCount !== 297 ||
                  sourceManifest.keyManifestSha256 !==
                    "f6796a4895a0699814464e8edff9e5d6a0fd80722bb8154623b98b255e72dfda" ||
                  sourceManifest.payloadManifestSha256 !==
                    process.env.EXPECTED_QUEUE_SOURCE_MANIFEST
                ) {
                  throw new Error("Frozen DB0 queue source no longer matches the approved manifest");
                }

                const dataKeys = await scanKeys(cacheRedis, "llm:v3:data:*");
                const activeManifestKeys = dataKeys.filter((key) => key.endsWith(":active"));
                if (activeManifestKeys.length < 1) throw new Error("No active Data publication exists");
                const permanentKeys = new Set();
                const activePublications = [];
                for (const activeKey of activeManifestKeys) {
                  const payload = await cacheRedis.get(activeKey);
                  if (!payload) throw new Error("Active Data publication payload is missing");
                  const manifest = JSON.parse(payload);
                  if (!Array.isArray(manifest.items) || manifest.items.length === 0) {
                    throw new Error("Active Data publication item manifest is invalid");
                  }
                  permanentKeys.add(activeKey);
                  for (const item of manifest.items) {
                    const [type, pttl, value] = await Promise.all([
                      cacheRedis.type(item.key),
                      cacheRedis.pttl(item.key),
                      cacheRedis.get(item.key),
                    ]);
                    if (type !== "string" || pttl !== -1 || value === null) {
                      throw new Error("Active Data item type/TTL contract failed");
                    }
                    if (
                      Buffer.byteLength(value, "utf8") !== item.bytes ||
                      createHash("sha256").update(value, "utf8").digest("hex") !== item.sha256
                    ) {
                      throw new Error("Active Data item payload contract failed");
                    }
                    permanentKeys.add(item.key);
                  }
                  activePublications.push({
                    key: activeKey,
                    dataset: manifest.dataset,
                    publicationId: manifest.publicationId,
                    revision: manifest.revision,
                    itemCount: manifest.items.length,
                  });
                }

                const core = activePublications.find(
                  (publication) => publication.key === "llm:v3:data:fpl:core:2627:active",
                );
                if (
                  !core ||
                  core.publicationId !== "1f08ab2f-732b-449f-868c-4a2038c5f1ba" ||
                  core.revision !== 2 ||
                  core.itemCount !== 6
                ) {
                  throw new Error("Terminal core publication identity is invalid");
                }

                let expiringDataKeys = 0;
                for (const key of dataKeys) {
                  const pttl = await cacheRedis.pttl(key);
                  if (permanentKeys.has(key)) {
                    if (pttl !== -1) throw new Error("Active Data key unexpectedly expires");
                  } else {
                    if (pttl <= 0 || pttl > 86_400_000) {
                      throw new Error("Orphan or unbounded Data staging/retired key found");
                    }
                    expiringDataKeys += 1;
                  }
                }

                const queryKeys = await scanKeys(cacheRedis, "llm:v3:gql:*");
                let expiredDuringScan = 0;
                const queryTtls = [];
                for (const key of queryKeys) {
                  const [type, ttl] = await Promise.all([cacheRedis.type(key), cacheRedis.ttl(key)]);
                  if (type === "none" && ttl === -2) {
                    expiredDuringScan += 1;
                    continue;
                  }
                  if (type !== "string" || ttl <= 0 || ttl > 3600) {
                    throw new Error("GraphQL query-cache type/TTL contract failed");
                  }
                  queryTtls.push(ttl);
                }
                if (queryTtls.length < 1) throw new Error("Fresh GraphQL query cache was not observed");

                const targetBullKeys = await scanKeys(queueRedis, "bull:*");
                const targetCoordinationKeys = await scanKeys(
                  queueRedis,
                  "llm:v3:queue:coordination:*",
                );
                const queueDataKeys = await scanKeys(queueRedis, "llm:v3:data:*");
                const queueGraphqlKeys = await scanKeys(queueRedis, "llm:v3:gql:*");
                if (targetBullKeys.length < 1) throw new Error("Active queue DB has no BullMQ state");
                if (queueDataKeys.length !== 0 || queueGraphqlKeys.length !== 0) {
                  throw new Error("Cache data leaked into the queue Redis endpoint");
                }

                console.log(JSON.stringify({
                  status: "v3_terminal_redis_acceptance_passed",
                  endpoints: {
                    separated: true,
                    cache: { hostRecorded: false, port: cacheEndpoint.port, db: cacheEndpoint.db },
                    queue: { hostRecorded: false, port: queueEndpoint.port, db: queueEndpoint.db },
                  },
                  frozenQueueSource: {
                    keyCount: sourceManifest.keyCount,
                    keyManifestSha256: sourceManifest.keyManifestSha256,
                    payloadManifestSha256: sourceManifest.payloadManifestSha256,
                  },
                  activeQueueTarget: {
                    bullKeyCount: targetBullKeys.length,
                    coordinationKeyCount: targetCoordinationKeys.length,
                  },
                  dataCache: {
                    keyCount: dataKeys.length,
                    activePublicationCount: activePublications.length,
                    expiringRetiredOrStagingKeyCount: expiringDataKeys,
                    activePublications,
                  },
                  graphqlQueryCache: {
                    observedKeyCount: queryKeys.length,
                    validatedKeyCount: queryTtls.length,
                    expiredDuringScan,
                    minTtlSeconds: Math.min(...queryTtls),
                    maxTtlSeconds: Math.max(...queryTtls),
                  },
                }));
              } finally {
                await Promise.allSettled([cacheRedis.quit(), queueRedis.quit()]);
              }
            '

            PSQL_IMAGE='docker.io/library/postgres:15.8-alpine@sha256:68c8f729caca8638396647002948c0ab753fda787cbee9e887f7166169c6b87e'
            docker pull "$PSQL_IMAGE"
            acceptance_dir=$(mktemp -d)
            cleanup_acceptance_dir() {
              saved_status=$?
              rm -rf "$acceptance_dir"
              exit "$saved_status"
            }
            trap cleanup_acceptance_dir EXIT

            run_capture() {
              sql_file="$1"
              docker run --rm \
                --env-file .env.migrate \
                --volume "$VPS_WORKDIR/sql/v3:/validation:ro" \
                "$PSQL_IMAGE" \
                sh -eu -c \
                'database_url="$DATABASE_URL"; database_url="${database_url#\"}"; database_url="${database_url%\"}"; exec psql "$database_url" --no-psqlrc --set ON_ERROR_STOP=on --file "/validation/$1"' \
                sh "$sql_file" > "$acceptance_dir/$sql_file.raw"
            }

            run_capture capture-public-relation-hashes.sql
            run_capture capture-v3-business-relation-hashes.sql
            run_capture capture-public-sequence-state.sql
            run_capture capture-public-security-contract.sql

            grep -E '^(relation,row_count,sha256|public\.[^,]+,[0-9]+,[0-9a-f]{64})$' \
              "$acceptance_dir/capture-public-relation-hashes.sql.raw" \
              > "$acceptance_dir/public-relations.csv"
            grep -E '^(relation,row_count,sha256|(bridge|competition|fpl|understat|reporting)\.[^,]+,[0-9]+,[0-9a-f]{64})$' \
              "$acceptance_dir/capture-v3-business-relation-hashes.sql.raw" \
              > "$acceptance_dir/v3-business.csv"
            grep -E '^(sequence,last_value,is_called,start_value,min_value,max_value,increment_by,cycle,cache_size|public\.[^,]+,-?[0-9]+,[tf],-?[0-9]+,-?[0-9]+,-?[0-9]+,-?[0-9]+,[tf],[0-9]+)$' \
              "$acceptance_dir/capture-public-sequence-state.sql.raw" \
              > "$acceptance_dir/public-sequences.csv"
            grep -E '^(record_type,object_type,object_name,owner_or_grantee,privilege,is_grantable|"?(owner|acl)"?,)' \
              "$acceptance_dir/capture-public-security-contract.sql.raw" \
              > "$acceptance_dir/public-security.csv"

            test "$(wc -l < "$acceptance_dir/public-relations.csv" | tr -d ' ')" -eq 201
            test "$(wc -l < "$acceptance_dir/v3-business.csv" | tr -d ' ')" -eq 46
            test "$(wc -l < "$acceptance_dir/public-sequences.csv" | tr -d ' ')" -eq 23
            test "$(wc -l < "$acceptance_dir/public-security.csv" | tr -d ' ')" -eq 390

            public_hash=$(sha256sum "$acceptance_dir/public-relations.csv" | awk '{print $1}')
            v3_hash=$(sha256sum "$acceptance_dir/v3-business.csv" | awk '{print $1}')
            sequence_hash=$(sha256sum "$acceptance_dir/public-sequences.csv" | awk '{print $1}')
            security_hash=$(sha256sum "$acceptance_dir/public-security.csv" | awk '{print $1}')
            test "$public_hash" = 'be0adcb28347b1688cb6f07552faa5cf53e81d2c3de5e49d7ec5068428a361e2'
            test "$v3_hash" = '4d10062af6a9d187078d31bb1c0d885f9e7ffca9fc63957c24eb3073a5300bd5'
            test "$sequence_hash" = '4b33a696be0cf5aaabfd0dd0899395dc98639e19c47861f494c2892d87ddab2d'
            test "$security_hash" = '70158adcebd6284d0b02d67a9df06183481c1b77316d6e79315ae7854c95f52c'
            echo "V3_TERMINAL_DATABASE_HASHES={\"public\":\"$public_hash\",\"v3Business\":\"$v3_hash\",\"publicSequences\":\"$sequence_hash\",\"publicSecurity\":\"$security_hash\"}"

            docker run --rm -i \
              --env-file .env.migrate \
              "$PSQL_IMAGE" \
              sh -eu -c \
              'database_url="$DATABASE_URL"; database_url="${database_url#\"}"; database_url="${database_url%\"}"; exec psql "$database_url" --no-psqlrc --set ON_ERROR_STOP=on --tuples-only --no-align' <<SQL
            BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;
            DO \$terminal_acceptance\$
            DECLARE
              failed_checks bigint;
              physical_relations bigint;
              mutation_fences bigint;
            BEGIN
              IF (SELECT count(*) FROM ops.migration_runs
                  WHERE run_id = '$CUTOVER_RUN_ID' AND status = 'activated') <> 1 THEN
                RAISE EXCEPTION 'terminal migration run is not activated';
              END IF;
              IF (SELECT count(*) FROM ops.migration_objects
                  WHERE run_id = '$CUTOVER_RUN_ID'
                    AND status = 'passed' AND failed_count = 0) <> 53
                 OR EXISTS (
                   SELECT 1 FROM ops.migration_objects
                   WHERE run_id = '$CUTOVER_RUN_ID'
                     AND (status <> 'passed' OR failed_count <> 0)
                 ) THEN
                RAISE EXCEPTION 'terminal migration reconciliation is not 53/53';
              END IF;
              IF (SELECT count(*) FROM pg_class
                  WHERE relnamespace = 'public'::regnamespace
                    AND relkind IN ('r', 'p', 'm', 'v')) <> 200 THEN
                RAISE EXCEPTION 'terminal public relation count is not 200';
              END IF;
              IF (SELECT count(*) FROM pg_class relation_row
                  JOIN pg_namespace namespace_row ON namespace_row.oid = relation_row.relnamespace
                  WHERE namespace_row.nspname IN ('fpl','competition','understat','bridge','reporting')
                    AND relation_row.relkind IN ('r','m','v')) <> 45 THEN
                RAISE EXCEPTION 'terminal v3 business relation count is not 45';
              END IF;
              IF (SELECT count(*) FROM pg_class
                  WHERE relnamespace = 'public'::regnamespace AND relkind = 'S') <> 22 THEN
                RAISE EXCEPTION 'terminal public sequence count is not 22';
              END IF;
              IF EXISTS (
                SELECT 1 FROM pg_constraint constraint_row
                JOIN pg_namespace namespace_row ON namespace_row.oid = constraint_row.connamespace
                WHERE namespace_row.nspname IN ('ops','fpl','competition','understat','bridge','reporting')
                  AND NOT constraint_row.convalidated
              ) OR EXISTS (
                SELECT 1 FROM pg_index index_row
                JOIN pg_class relation_row ON relation_row.oid = index_row.indexrelid
                JOIN pg_namespace namespace_row ON namespace_row.oid = relation_row.relnamespace
                WHERE namespace_row.nspname IN ('ops','fpl','competition','understat','bridge','reporting')
                  AND (NOT index_row.indisvalid OR NOT index_row.indisready)
              ) THEN
                RAISE EXCEPTION 'terminal invalid constraint or index found';
              END IF;
              IF (SELECT count(*) FROM ops.dataset_publications publication
                  JOIN fpl.seasons season ON season.season_id = publication.season_id
                  WHERE season.is_current
                    AND publication.dataset = 'fpl:core'
                    AND publication.event_id IS NULL
                    AND publication.status = 'active'
                    AND publication.publication_id = '1f08ab2f-732b-449f-868c-4a2038c5f1ba'
                    AND publication.revision = 2
                    AND publication.manifest ->> 'state' = 'active') <> 1 THEN
                RAISE EXCEPTION 'terminal active core publication identity mismatch';
              END IF;
              IF EXISTS (
                SELECT 1 FROM ops.dataset_publications
                WHERE status = 'staging'
              ) OR EXISTS (
                SELECT 1 FROM ops.dataset_publications
                WHERE status = 'active'
                GROUP BY season_id, dataset, coalesce(event_id, -1)
                HAVING count(*) > 1
              ) THEN
                RAISE EXCEPTION 'terminal orphan staging or mixed active revision found';
              END IF;
              IF (SELECT count(*) FROM ops.schema_migrations
                  WHERE filename ~ '^009[123]_') <> 0 THEN
                RAISE EXCEPTION 'legacy cleanup migration was applied';
              END IF;

              SELECT count(*) INTO physical_relations
              FROM pg_class
              WHERE relnamespace = 'public'::regnamespace AND relkind IN ('r','p');
              SELECT count(*) INTO mutation_fences
              FROM pg_class relation_row
              JOIN pg_trigger trigger_row ON trigger_row.tgrelid = relation_row.oid
              WHERE relation_row.relnamespace = 'public'::regnamespace
                AND relation_row.relkind IN ('r','p')
                AND trigger_row.tgname = 'v3_reject_v2_mutation'
                AND trigger_row.tgfoid = 'ops.reject_v2_mutation()'::regprocedure
                AND NOT trigger_row.tgisinternal;
              IF physical_relations <> 193 OR mutation_fences <> physical_relations THEN
                RAISE EXCEPTION 'terminal v2 physical/fence contract mismatch';
              END IF;
              IF EXISTS (
                SELECT 1 FROM pg_class relation_row
                WHERE relation_row.relnamespace = 'public'::regnamespace
                  AND relation_row.relkind IN ('r','p','m','v','S')
                  AND NOT (relation_row.relkind = 'v' AND relation_row.relname = 'sql_migrations')
                  AND relation_row.relowner <> 'letletme_v2_frozen_owner'::regrole
              ) THEN
                RAISE EXCEPTION 'terminal v2 owner contract mismatch';
              END IF;
              IF EXISTS (
                SELECT 1 FROM pg_roles role_row
                WHERE role_row.rolname IN ('letletme_data_runtime','letletme_graphql_runtime')
                  AND (NOT role_row.rolcanlogin OR NOT role_row.rolinherit OR role_row.rolsuper
                    OR role_row.rolcreatedb OR role_row.rolcreaterole OR role_row.rolreplication
                    OR role_row.rolbypassrls)
              ) THEN
                RAISE EXCEPTION 'terminal runtime login attributes are invalid';
              END IF;
              SELECT count(*) INTO failed_checks
              FROM pg_auth_members membership
              JOIN pg_roles member_role ON member_role.oid = membership.member
              JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
              WHERE member_role.rolname IN ('letletme_data_runtime','letletme_graphql_runtime')
                AND (member_role.rolname, granted_role.rolname) NOT IN (
                  ('letletme_data_runtime','letletme_data_writer'),
                  ('letletme_graphql_runtime','letletme_graphql_reader')
                );
              IF failed_checks <> 0 OR
                 (SELECT count(*) FROM pg_auth_members membership
                  JOIN pg_roles member_role ON member_role.oid = membership.member
                  WHERE member_role.rolname IN ('letletme_data_runtime','letletme_graphql_runtime')) <> 2 THEN
                RAISE EXCEPTION 'terminal runtime role memberships are invalid';
              END IF;
            END
            \$terminal_acceptance\$;
            SELECT jsonb_build_object(
              'status', 'v3_terminal_database_acceptance_passed',
              'runId', '$CUTOVER_RUN_ID',
              'migrationChecks', (SELECT count(*) FROM ops.migration_objects
                WHERE run_id = '$CUTOVER_RUN_ID' AND status = 'passed' AND failed_count = 0),
              'publicRelations', (SELECT count(*) FROM pg_class
                WHERE relnamespace = 'public'::regnamespace AND relkind IN ('r','p','m','v')),
              'v3BusinessRelations', (SELECT count(*) FROM pg_class relation_row
                JOIN pg_namespace namespace_row ON namespace_row.oid = relation_row.relnamespace
                WHERE namespace_row.nspname IN ('fpl','competition','understat','bridge','reporting')
                  AND relation_row.relkind IN ('r','m','v')),
              'publicSequences', (SELECT count(*) FROM pg_class
                WHERE relnamespace = 'public'::regnamespace AND relkind = 'S'),
              'frozenPhysicalRelations', (SELECT count(*) FROM pg_class
                WHERE relnamespace = 'public'::regnamespace AND relkind IN ('r','p')),
              'activePublications', (SELECT count(*) FROM ops.dataset_publications WHERE status = 'active'),
              'stagingPublications', (SELECT count(*) FROM ops.dataset_publications WHERE status = 'staging'),
              'cleanupMigrationsApplied', (SELECT count(*) FROM ops.schema_migrations WHERE filename ~ '^009[123]_')
            );
            COMMIT;
            SQL

            scan_logs() {
              service_name="$1"
              container_id="$2"
              log_file="$acceptance_dir/$service_name.log"
              docker logs "$container_id" > "$log_file" 2>&1
              if grep -Eaiq '(postgres(ql)?|redis(s)?)://[^[:space:]"]+:[^[:space:]"]+@|Authorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|DATABASE_URL=.*://|REDIS_PASSWORD=|GRAPHQL_SERVICE_TOKEN=|DATA_API_KEY=|SUPABASE_KEY=' "$log_file"; then
                echo "Secret-shaped value found in $service_name logs"
                exit 1
              fi
              if grep -Eaiq 'relation .* does not exist|column .* does not exist|undefined_table' "$log_file"; then
                echo "Missing-relation error found in $service_name logs"
                exit 1
              fi
              if grep -Eaiq 'permission denied|insufficient_privilege' "$log_file"; then
                echo "Permission error found in $service_name logs"
                exit 1
              fi
              if grep -Eaiq 'WRONGTYPE' "$log_file"; then
                echo "Redis WRONGTYPE error found in $service_name logs"
                exit 1
              fi
              if grep -Eaiq 'mixed[- _]?revision|publication.*revision.*mismatch' "$log_file"; then
                echo "Mixed-revision error found in $service_name logs"
                exit 1
              fi
              log_sha=$(sha256sum "$log_file" | awk '{print $1}')
              log_lines=$(wc -l < "$log_file" | tr -d ' ')
              echo "V3_TERMINAL_LOG_$service_name={\"lines\":$log_lines,\"sha256\":\"$log_sha\",\"forbiddenMatches\":0}"
            }

            scan_logs data_api "$api_cid"
            scan_logs data_worker "$worker_cid"
            scan_logs graphql "$graphql_cid"
            echo "V3_TERMINAL_SERVICES={\"dataImage\":\"$DATA_IMAGE_REF\",\"graphqlImage\":\"$GRAPHQL_IMAGE_REF\",\"dataApi\":\"healthy\",\"dataWorker\":\"healthy\",\"graphql\":\"healthy\"}"
            echo 'V3_TERMINAL_ACCEPTANCE=passed'

  v3_stop:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-stop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stop only Data API and worker for the approved hard cut
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
          V3_CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: VPS_WORKDIR,V3_CUTOVER_RUN_ID,V3_CUTOVER_APPROVAL
          script: |
            set -euo pipefail
            [[ "$V3_CUTOVER_RUN_ID" =~ ^v3-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,12}$ ]]
            test "$V3_CUTOVER_APPROVAL" = "APPROVE_V3_ACTIVATION $V3_CUTOVER_RUN_ID"
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            docker compose stop -t 30 worker
            docker compose stop -t 30 api
            test -z "$(docker compose ps -q worker)"
            test -z "$(docker compose ps -q api)"
            data_http=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health || true)
            test "$data_http" = "000"
            echo "V3_DATA_API=stopped"
            echo "V3_DATA_WORKER=stopped"

  v3_validate_database:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.operation == 'v3-validate-database'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate activated production database with services stopped
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          IMAGE_REF: ${{ github.event.client_payload.v3_image_ref }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          envs: EXPECTED_SHA,IMAGE_REF,CUTOVER_RUN_ID,GHCR_USER,GHCR_TOKEN,VPS_WORKDIR
          script: |
            set -euo pipefail
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
            [[ "$CUTOVER_RUN_ID" =~ ^v3-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,12}$ ]]
            test -d "$VPS_WORKDIR/.git"
            cd "$VPS_WORKDIR"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            test -f .env.migrate
            test -f sql/v3/validate-0090-activation.sql
            test -f sql/v3/validate-p5-quality.sql
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q api)"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/health || true)" = '000'

            LOWER_USER=$(printf '%s' "$GHCR_USER" | tr '[:upper:]' '[:lower:]')
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$LOWER_USER" --password-stdin
            APP_IMAGE="$IMAGE_REF" docker compose pull migration
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migration-contract

            set +e
            repeat_output=$(APP_IMAGE="$IMAGE_REF" docker compose run --rm -T \
              migration bun run db:apply-sql 2>&1)
            repeat_status=$?
            set -e
            printf '%s\n' "$repeat_output"
            test "$repeat_status" -eq 0
            if printf '%s\n' "$repeat_output" | grep -Fq '[sql-migrate] applied '; then
              echo 'Repeat migration command unexpectedly applied a migration'
              exit 1
            fi
            echo 'V3_REPEAT_MIGRATIONS_APPLIED=0'
            APP_IMAGE="$IMAGE_REF" docker compose run --rm -T migration bun run db:migrate:status

            PSQL_IMAGE='docker.io/library/postgres:15.8-alpine@sha256:68c8f729caca8638396647002948c0ab753fda787cbee9e887f7166169c6b87e'
            docker pull "$PSQL_IMAGE"
            VALIDATION_DIR=$(mktemp -d)
            trap 'rm -rf "$VALIDATION_DIR"' EXIT
            cp \
              sql/v3/validate-0090-activation.sql \
              sql/v3/validate-p5-quality.sql \
              sql/v3/capture-public-relation-hashes.sql \
              sql/v3/capture-v3-business-relation-hashes.sql \
              sql/v3/capture-public-sequence-state.sql \
              sql/v3/capture-public-security-contract.sql \
              "$VALIDATION_DIR/"

            # Keep the approved R3 runtime candidate immutable. Its validator has
            # one PL/pgSQL CASE-expression parser ambiguity, so patch only the
            # SHA-guarded temporary validation copy and leave the checkout intact.
            validator_sha=$(sha256sum "$VALIDATION_DIR/validate-0090-activation.sql" | awk '{print $1}')
            test "$validator_sha" = '0443c71728e07a24e397dbbad39d1b016623f05333265b1abb208e62fdd15756'
            sed -i \
              '31s/+ CASE/+ (/;32s/^       WHEN/       CASE\n         WHEN/;33s/^       ELSE/         ELSE/;34s/^     END$/       END\n     )/' \
              "$VALIDATION_DIR/validate-0090-activation.sql"
            grep -Fq 'legacy_physical_count <> 192 + (' \
              "$VALIDATION_DIR/validate-0090-activation.sql"
            echo 'V3_R3_VALIDATOR_PATCH=case-expression-parenthesized'

            # The final production B0 backup supersedes the earlier rehearsal
            # snapshot: 283 verified provider links were added before hard cut.
            # Migration-object row/hash parity independently proves all 2,192
            # frozen source rows reached bridge.entity_links.
            quality_sha=$(sha256sum "$VALIDATION_DIR/validate-p5-quality.sql" | awk '{print $1}')
            test "$quality_sha" = '709123d52eab4db0849961590f4fcbe397ed4584042a420391b699cb78b07a91'
            sed -i '324s/<> 1909/<> 2192/' "$VALIDATION_DIR/validate-p5-quality.sql"
            grep -Fq '(SELECT count(*) FROM bridge.entity_links) <> 2192' \
              "$VALIDATION_DIR/validate-p5-quality.sql"
            echo 'V3_FINAL_B0_ENTITY_LINKS=2192'
            run_psql_file() {
              sql_file="$1"
              docker run --rm \
                --env-file .env.migrate \
                --volume "$VALIDATION_DIR:/validation:ro" \
                "$PSQL_IMAGE" \
                sh -eu -c \
                'database_url="$DATABASE_URL"; database_url="${database_url#\"}"; database_url="${database_url%\"}"; exec psql "$database_url" --no-psqlrc --set ON_ERROR_STOP=on --file "/validation/$1"' \
                sh "$sql_file"
            }

            run_psql_file validate-0090-activation.sql
            run_psql_file validate-p5-quality.sql
            run_psql_file capture-public-relation-hashes.sql
            run_psql_file capture-v3-business-relation-hashes.sql
            run_psql_file capture-public-sequence-state.sql
            run_psql_file capture-public-security-contract.sql

            validation_summary_sql="
              SELECT jsonb_build_object(
                'status', 'v3_production_database_validation_passed',
                'runId', run_id,
                'runStatus', status,
                'migrationChecks', (
                  SELECT count(*) FROM ops.migration_objects
                  WHERE run_id = '$CUTOVER_RUN_ID'
                    AND status = 'passed' AND failed_count = 0
                ),
                'publicRelations', (
                  SELECT count(*) FROM pg_class
                  WHERE relnamespace = 'public'::regnamespace
                    AND relkind IN ('r', 'p', 'm', 'v')
                ),
                'v3BusinessRelations', (
                  SELECT count(*) FROM pg_class relation_row
                  JOIN pg_namespace namespace_row
                    ON namespace_row.oid = relation_row.relnamespace
                  WHERE namespace_row.nspname IN (
                    'fpl', 'competition', 'understat', 'bridge', 'reporting'
                  ) AND relation_row.relkind IN ('r', 'm', 'v')
                ),
                'publicSequences', (
                  SELECT count(*) FROM pg_class
                  WHERE relnamespace = 'public'::regnamespace AND relkind = 'S'
                ),
                'cleanupMigrationsApplied', (
                  SELECT count(*) FROM ops.schema_migrations
                  WHERE filename ~ '^009[123]_'
                )
              )
              FROM ops.migration_runs
              WHERE run_id = '$CUTOVER_RUN_ID';
            "
            docker run --rm \
              --env-file .env.migrate \
              "$PSQL_IMAGE" \
              sh -eu -c \
              'database_url="$DATABASE_URL"; database_url="${database_url#\"}"; database_url="${database_url%\"}"; exec psql "$database_url" --no-psqlrc --set ON_ERROR_STOP=on --tuples-only --no-align --command "$1"' \
              sh "$validation_summary_sql"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q api)"
            test -z "$(APP_IMAGE="$IMAGE_REF" docker compose ps -q worker)"
            echo 'V3_DATABASE_VALIDATION_SERVICES=stopped'
