name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Dependency vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            ./

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build hermetic unit-test image
        run: docker build --target test --tag letletme-data:test .

      - name: Unit tests only (no network or live infrastructure)
        run: >-
          docker run --rm --network none
          --env NODE_ENV=test
          --env DATABASE_URL=postgresql://unit:unit@127.0.0.1:1/unit
          --env CACHE_REDIS_HOST=127.0.0.1
          --env CACHE_REDIS_PORT=1
          --env CACHE_REDIS_DB=9
          --env QUEUE_REDIS_HOST=127.0.0.1
          --env QUEUE_REDIS_PORT=2
          --env QUEUE_REDIS_DB=10
          letletme-data:test

      - name: Unit files are order-independent
        run: bun run test:unit:isolated

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          CACHE_REDIS_HOST: 127.0.0.1
          CACHE_REDIS_PORT: '6379'
          CACHE_REDIS_DB: '9'
          QUEUE_REDIS_HOST: 127.0.0.1
          QUEUE_REDIS_PORT: '6379'
          QUEUE_REDIS_DB: '10'
        run: bun run build

      - name: Build production runtime image
        run: docker build --target runner --tag letletme-data:ci .

      - name: Validate Compose worker inventory and database pool budget
        run: |
          docker compose config --quiet
          DATABASE_CONNECTION_BUDGET=15 scripts/check-database-pool-budget.sh

      - name: Verify production runtime identity and host runner artifact
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' letletme-data:ci)" = "appuser"
          test "$(docker run --rm --entrypoint id letletme-data:ci -u)" = "1001"
          docker run --rm --entrypoint sh letletme-data:ci -c \
            'test "$HOME" = /home/appuser && test -x /app/letletme-grok-runner && \
             test -f /app/dist/media-worker.js && \
             test ! -e /app/node_modules/.bin/grok && test ! -e /home/appuser/.grok && \
             test "$(getent group letletme-grok-bridge | cut -d: -f3)" = 1555 && \
             ! id -Gn | tr " " "\n" | grep -qx letletme-grok-bridge && \
             test -r /app/config/briefing/sources.yaml && \
             test -r /app/config/briefing/acquisition-plan.yaml'

      - name: Production dependency audit
        run: bun audit --production

  integration:
    name: integration (${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.14']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stub Supabase client roles (plain Postgres CI)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: >-
          bun -e 'import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          for (const role of ["anon", "authenticated", "service_role"])
          await sql.unsafe("DO $$ BEGIN CREATE ROLE " + role + " NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$");
          await sql.end();'

      - name: Apply schema and verify repeatability
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          bun run db:migrate
          bun run db:migrate
          bun run db:migrate:status

      - name: Bootstrap and verify disposable runtime logins
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DATA_RUNTIME_DATABASE_URL: postgresql://letletme_data_runtime:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd@127.0.0.1:5432/ci
          SHARED_GRAPHQL_RUNTIME_DATABASE_URL: postgresql://letletme_graphql_runtime:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd@127.0.0.1:5432/ci
          GRAPHQL_RUNTIME_DATABASE_URL: postgresql://letletme_graphql_runtime:gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg@127.0.0.1:5432/ci
        run: |
          RUNTIME_DATABASE_URL="$DATA_RUNTIME_DATABASE_URL" \
            bun run db:bootstrap-runtime-login -- --target=data
          if RUNTIME_DATABASE_URL="$SHARED_GRAPHQL_RUNTIME_DATABASE_URL" \
            bun run db:bootstrap-runtime-login -- --target=graphql; then
            echo "bootstrap accepted a password already used by the Data runtime login" >&2
            exit 1
          fi
          RUNTIME_DATABASE_URL="$GRAPHQL_RUNTIME_DATABASE_URL" \
            bun run db:bootstrap-runtime-login -- --target=graphql
          RUNTIME_DATABASE_URL="$DATA_RUNTIME_DATABASE_URL" \
            bun run db:bootstrap-runtime-login -- --target=data
          RUNTIME_DATABASE_URL="$GRAPHQL_RUNTIME_DATABASE_URL" \
            bun run db:bootstrap-runtime-login -- --target=graphql
          password_hashes_before=$(bun -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL, { max: 1 }); const rows = await sql`SELECT rolname, rolpassword FROM pg_authid WHERE rolname = ANY(${["letletme_data_runtime", "letletme_graphql_runtime"]}::text[]) ORDER BY rolname`; process.stdout.write(JSON.stringify(rows)); await sql.end();')
          bun run db:verify-runtime-logins
          password_hashes_after=$(bun -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL, { max: 1 }); const rows = await sql`SELECT rolname, rolpassword FROM pg_authid WHERE rolname = ANY(${["letletme_data_runtime", "letletme_graphql_runtime"]}::text[]) ORDER BY rolname`; process.stdout.write(JSON.stringify(rows)); await sql.end();')
          test "$password_hashes_before" = "$password_hashes_after"

      - name: Build disposable Drizzle schema export
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          SCHEMA_EXPORT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/schema_export_test
        run: |
          bun -e 'import postgres from "postgres"; const db = postgres(process.env.DATABASE_URL, { max: 1 }); await db.unsafe("CREATE DATABASE schema_export_test"); await db.end();'
          bun -e 'import postgres from "postgres"; const db = postgres(process.env.SCHEMA_EXPORT_DATABASE_URL, { max: 1 }); await db.unsafe("CREATE SCHEMA IF NOT EXISTS extensions"); await db.unsafe("CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA extensions"); await db.end();'
          DATABASE_URL="$SCHEMA_EXPORT_DATABASE_URL" bun run db:export > /tmp/schema-export.sql
          bun -e 'import postgres from "postgres"; const db = postgres(process.env.SCHEMA_EXPORT_DATABASE_URL, { max: 1 }); const ddl = await Bun.file("/tmp/schema-export.sql").text(); await db.unsafe(ddl); await db.end();'

      - name: Populate reporting materialized views for integration fixtures
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          bun -e 'import postgres from "postgres"; const db = postgres(process.env.DATABASE_URL, { max: 1 }); await db`REFRESH MATERIALIZED VIEW reporting.tournament_entry_event_summaries`; await db`REFRESH MATERIALIZED VIEW reporting.tournament_selection_stats`; await db.end();'

      - name: Fresh-database integration tests
        env:
          RUN_INTEGRATION: 1
          RUN_SCHEMA_DECLARATION_PARITY: 1
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          SCHEMA_EXPORT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/schema_export_test
          CACHE_REDIS_HOST: 127.0.0.1
          CACHE_REDIS_PORT: '6379'
          CACHE_REDIS_DB: '9'
          QUEUE_REDIS_HOST: 127.0.0.1
          QUEUE_REDIS_PORT: '6379'
          QUEUE_REDIS_DB: '10'
          # Finalizer integration fixtures use future seasons and never call the provider.
          UNDERSTAT_ENABLED: 'true'
          UNDERSTAT_LEAGUE: EPL
          UNDERSTAT_MIN_SEASON: '9798'
          UNDERSTAT_SEASON: '9899'
        run: bun run test:integration
