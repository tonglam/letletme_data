name: Briefing X media probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: briefing-x-media-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/codex/briefing-full-12h'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run media-bearing X post probe on production host
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail

            tmp_dir=$(mktemp -d /tmp/letletme-x-media-probe.XXXXXX)
            trap 'rm -rf "$tmp_dir"' EXIT
            output_file="$tmp_dir/output.jsonl"
            trace_file="$tmp_dir/trace.log"

            set +e
            sudo -u deploy -H env \
              HOME=/home/deploy \
              GROK_HOME=/home/deploy/.grok \
              GROK_NO_AUTO_UPDATE=1 \
              /home/deploy/.grok/bin/grok \
                --always-approve \
                --sandbox strict \
                --output-format streaming-messages-json \
                --disable-web-search \
                --no-subagents \
                --no-plan \
                --max-turns 4 \
                --disallowed-tools 'Bash,Edit,Read,Grep,WebFetch,MCPTool,Write,Glob,WebSearch,image_gen,image_edit,image_to_video' \
                --deny 'Bash(*)' \
                --deny 'Edit(*)' \
                --deny 'Read(*)' \
                --deny 'Grep(*)' \
                --deny 'WebFetch(*)' \
                --deny 'MCPTool(*)' \
                --deny 'Write(*)' \
                --deny 'Glob(*)' \
                --deny 'WebSearch(*)' \
                -p 'Use x_thread_fetch exactly once with post_id 2091144605710647466. Return only one JSON object and no prose: {"posts":[{"postId":"string","authorHandle":"string","createdAt":"ISO-8601","text":"full exact post text","url":"https://x.com/...","media":[{"kind":"IMAGE|VIDEO|OTHER","url":"public media URL or null","mimeType":"string or null","altText":"exact alt text or null"}]}]}. Copy media only when the X tool provides it. If the tool does not provide media metadata, return media as an empty array; never invent a URL or visual fact. Do not use any other tool.' \
              >"$output_file" 2>"$trace_file"
            status=$?
            set -e

            printf '%s\n' '--- output bytes ---'
            wc -c "$output_file"
            printf '%s\n' '--- output ---'
            sed -n '1,160p' "$output_file"
            printf '%s\n' '--- trace tail ---'
            tail -n 80 "$trace_file"
            exit "$status"
