name: FPL raw snapshot Storage gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify protected main dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"

      - name: Provision and probe the FPL raw snapshot bucket over pinned OpenSSH
        uses: ./.github/actions/pinned-openssh
        env:
          ROLLOUT_SHA: ${{ github.sha }}
          VPS_WORKDIR: ${{ vars.VPS_WORKDIR }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          private-key: ${{ secrets.VPS_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          timeout: 12m
          envs: ROLLOUT_SHA,VPS_WORKDIR
          script: |
            set -euo pipefail

            expected_workdir=/home/workspace/letletme_data
            test "$VPS_WORKDIR" = "$expected_workdir"
            test "$(realpath --canonicalize-existing "$VPS_WORKDIR")" = "$expected_workdir"
            cd "$expected_workdir"
            test "$(git rev-parse HEAD)" = "$ROLLOUT_SHA"
            export DEPLOY_SHA="$ROLLOUT_SHA"
            compose() { docker compose "$@"; }
            source scripts/deploy-state-machine.sh
            acquire_deploy_lock
            trap 'release_deploy_lock || true' EXIT

            env_file="$expected_workdir/.env.deploy"
            test -f "$env_file"
            test ! -L "$env_file"
            if grep -q '^[[:space:]]*CONTENT_MEDIA_SUPABASE_SECRET_KEY[[:space:]]*=' "$env_file"; then
              echo 'FPL raw snapshot Storage gate refused: media secret is in .env.deploy' >&2
              exit 1
            fi

            current_container=$(docker compose ps -q api | head -n 1)
            test -n "$current_container"
            current_image=$(docker inspect --format '{{.Config.Image}}' "$current_container")
            test -n "$current_image"
            image_revision=$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$current_image")
            test "$image_revision" = "$ROLLOUT_SHA"

            APP_IMAGE="$current_image" docker compose run --rm -T --interactive=false --no-deps api \
              bun validate-env.ts --probe-fpl-raw-snapshot-storage
