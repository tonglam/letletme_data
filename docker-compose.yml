x-app-image: &app-image ${APP_IMAGE:-letletme-data:local}
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  migration:
    image: *app-image
    build:
      context: .
      target: runner
    profiles: ['migration']
    env_file:
      - path: ${MIGRATION_ENV_FILE:-.env.migrate}
        required: true
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - SCHEDULER_MODE=standalone
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
    command: bun scripts/migration-login-contract.ts
    logging: *default-logging
    restart: 'no'

  backup:
    image: postgres:${DATABASE_BACKUP_PG_MAJOR:-15}
    profiles: ['migration']
    env_file:
      - path: ${MIGRATION_ENV_FILE:-.env.migrate}
        required: true
    environment:
      - DATABASE_BACKUP_DIR=/var/backups/letletme-data
      - DATABASE_BACKUP_PG_MAJOR=${DATABASE_BACKUP_PG_MAJOR:-15}
      - DATABASE_BACKUP_KEEP=${DATABASE_BACKUP_KEEP:-7}
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
    volumes:
      - ${DATABASE_BACKUP_DIR:-/var/backups/letletme-data}:/var/backups/letletme-data
      - ./scripts:/app/scripts:ro
    command: ['bash', '/app/scripts/pre-migration-backup.sh']
    restart: 'no'

  api:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/index.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      # Force production even if .env.deploy omits/overrides NODE_ENV — logger
      # must not load pino-pretty (devDependency) in the runtime image.
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - SCHEDULER_MODE=standalone
      # Keep the sum of long-lived process pools below 80% of the usual
      # 15-session Supavisor budget, leaving room for migrations/probes.
      - DATABASE_POOL_MAX=2
    logging: *default-logging
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/worker.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - DATABASE_POOL_MAX=2
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      # worker.ts touches /tmp/worker-heartbeat every 30s; a stale file means
      # the event loop is hung even though the process still runs. find exits
      # 0 without matches, so assert on non-empty output.
      test: ['CMD-SHELL', 'test -n "$$(find /tmp/worker-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  live-picks-worker:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/live-picks-worker.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - DATABASE_POOL_MAX=2
      - LIVE_PICKS_WORKER_HEARTBEAT_PATH=/tmp/live-picks-worker-heartbeat
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'test -n "$$(find /tmp/live-picks-worker-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  official-h2h-worker:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/official-h2h-worker.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - DATABASE_POOL_MAX=1
      - OFFICIAL_H2H_WORKER_HEARTBEAT_PATH=/tmp/official-h2h-worker-heartbeat
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'test -n "$$(find /tmp/official-h2h-worker-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/scheduler.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - SCHEDULER_MODE=standalone
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - SCHEDULER_HEARTBEAT_PATH=/tmp/scheduler-heartbeat
      - DATABASE_POOL_MAX=1
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /tmp/scheduler-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  content-worker:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/content-worker.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - DATABASE_POOL_MAX=1
      - WORKER_HEARTBEAT_PATH=/tmp/content-worker-heartbeat
      - CONTENT_MANIFEST_GIT_REVISION=${CONTENT_MANIFEST_GIT_REVISION:-unknown}
      - CONTENT_GROK_RUNNER_SOCKET=${CONTENT_GROK_RUNNER_SOCKET:-/run/letletme-grok-runner/runner.sock}
      - CONTENT_GROK_RUNNER_RELEASE_SHA=${CONTENT_GROK_RUNNER_RELEASE_SHA:-unknown}
    volumes:
      - /run/letletme-grok-runner:/run/letletme-grok-runner:ro
    group_add:
      - '1555'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /tmp/content-worker-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  media-worker:
    image: *app-image
    build:
      context: .
      target: runner
    command: bun dist/media-worker.js
    env_file:
      - path: ${ENV_FILE:-.env.deploy}
        required: false
      - path: ${CONTENT_MEDIA_ENV_FILE:-.env.media}
        required: false
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DEPLOY_SHA=${DEPLOY_SHA:-unknown}
      - DATABASE_POOL_MAX=1
      - WORKER_HEARTBEAT_PATH=/tmp/media-worker-heartbeat
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /tmp/media-worker-heartbeat -mmin -2 2>/dev/null)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
